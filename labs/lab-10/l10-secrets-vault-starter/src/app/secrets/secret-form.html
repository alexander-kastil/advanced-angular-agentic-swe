<form (submit)="$event.preventDefault(); save()">
  <label>
    <span>Name</span>
    <input [formField]="secretForm.name" />
    @if (secretForm.name().touched() && secretForm.name().errors().length) {
      <em role="alert">{{ secretForm.name().errors()[0].message }}</em>
    } @else if (secretForm.name().pending()) {
      <em class="pending">Checking the name</em>
    }
  </label>

  <label>
    <span>User</span>
    <input [formField]="secretForm.user" />
  </label>

  <label>
    <span>Url</span>
    <input [formField]="secretForm.url" />
  </label>

  <label class="wide">
    <span>Value</span>
    <textarea rows="2" [formField]="secretForm.comment"></textarea>
  </label>

  <label class="inline">
    <input type="checkbox" [formField]="secretForm.mfa" />
    <span>Protected by MFA</span>
  </label>

  <fieldset class="wide">
    <legend>Categories</legend>
    @for (category of categories(); track category.categoryId) {
      <button type="button" class="chip" [style.--chip]="category.color"
              [class.on]="model().categoryIds.includes(category.categoryId)"
              [attr.aria-pressed]="model().categoryIds.includes(category.categoryId)"
              (click)="toggleCategory(category.categoryId)">
        {{ category.topic }}
      </button>
    }
    <span class="add">
      <input type="text" [value]="newCategory()" (input)="onNewCategory($event)"
             placeholder="new category" aria-label="New category name" />
      <button type="button" [disabled]="!newCategory().trim()" (click)="addCategory()">Add</button>
    </span>

    @if (secretForm.categoryIds().errors().length) {
      <em role="alert">{{ secretForm.categoryIds().errors()[0].message }}</em>
    }
  </fieldset>

  <div class="actions">
    <button type="submit" [disabled]="!canSave()">Save</button>
    @if (secretForm().submitting()) {
      <span class="pending">Saving</span>
    }
    @if (serverError(); as message) {
      <em role="alert">{{ message }}</em>
    }
  </div>
</form>
