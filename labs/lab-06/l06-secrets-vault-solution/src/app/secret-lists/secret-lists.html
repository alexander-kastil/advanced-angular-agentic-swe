<section aria-labelledby="secrets-heading">
  <h2 id="secrets-heading">Secrets</h2>
  <ul class="grid">
    @for (list of secretsLists(); track list.listId) {
      <li>
        <button type="button" class="card" [class.selected]="list.listId === selectedListId()"
                [attr.aria-pressed]="list.listId === selectedListId()" (click)="listSelected.emit(list.listId)">
          <span class="name">{{ list.name }}</span>
          <span class="description">{{ list.description }}</span>
          <span class="count">{{ list.secretCount }} secrets</span>
        </button>
      </li>
    }
  </ul>
</section>

<section aria-labelledby="vault-heading">
  <h2 id="vault-heading">Vault</h2>
  <ul class="grid">
    @for (list of vaultLists(); track list.listId) {
      <li>
        <button type="button" class="card" [class.selected]="list.listId === selectedListId()"
                [attr.aria-pressed]="list.listId === selectedListId()" (click)="listSelected.emit(list.listId)">
          <span class="name">{{ list.name }}</span>
          <span class="description">{{ list.description }}</span>
          <span class="count">{{ list.secretCount }} files</span>
        </button>
      </li>
    }
  </ul>
</section>
