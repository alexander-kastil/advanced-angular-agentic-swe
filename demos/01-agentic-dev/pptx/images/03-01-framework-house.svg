<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Framework skill and house skill</title>
  <desc>Left, the official Angular Agent Skills angular-developer and angular-new-app answer how Angular works: the httpResource() signature in v22 and scaffolding a new app. Right, the house skill angular-conventions answers how we work: which state library, the table that shifts on sort, never emit OnPush. Run both.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" transform="translate(0 35)">
    <rect x="40" y="130" width="800" height="750" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="440" y="205" font-size="38" font-weight="700" fill="#24292f" text-anchor="middle">Official Angular Agent Skills</text>
    <text x="440" y="255" font-size="28" fill="#57606a" text-anchor="middle">how Angular works</text>
    <rect x="145" y="290" width="300" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="295" y="335" font-size="28" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">angular-developer</text>
    <rect x="465" y="290" width="270" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="600" y="335" font-size="28" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">angular-new-app</text>
    <text x="80" y="430" font-size="28" font-weight="700" fill="#57606a">Wins on</text>
    <rect x="80" y="460" width="720" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="110" y="526" font-size="30" fill="#24292f"><tspan font-family="Consolas, monospace">httpResource()</tspan> signature in v22</text>
    <rect x="80" y="590" width="720" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="110" y="656" font-size="30" fill="#24292f">Scaffold a new app</text>

    <rect x="1080" y="130" width="800" height="750" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1480" y="205" font-size="38" font-weight="700" fill="#24292f" text-anchor="middle">House skill</text>
    <text x="1480" y="255" font-size="28" fill="#57606a" text-anchor="middle">how we work</text>
    <rect x="1310" y="290" width="340" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1480" y="335" font-size="28" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">angular-conventions</text>
    <text x="1120" y="430" font-size="28" font-weight="700" fill="#57606a">Wins on</text>
    <rect x="1120" y="460" width="720" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1150" y="526" font-size="30" fill="#24292f">Which state library?</text>
    <rect x="1120" y="590" width="720" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1150" y="656" font-size="30" fill="#24292f">Table shifts on sort</text>
    <rect x="1120" y="720" width="720" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1150" y="786" font-size="30" fill="#24292f">Never emit <tspan font-family="Consolas, monospace">OnPush</tspan></text>

    <rect x="860" y="465" width="200" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="3"/>
    <text x="960" y="517" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Run both</text>
  </g>
</svg>
