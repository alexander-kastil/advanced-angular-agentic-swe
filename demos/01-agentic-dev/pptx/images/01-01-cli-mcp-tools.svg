<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Angular CLI MCP server</title>
  <desc>The agent (Claude Code, GitHub Copilot) talks over stdio to the Angular CLI MCP server started with npx @angular/cli mcp. Its nine tools fall into four groups: Inspect, Dev server, Run and Guide; run_target and the devserver tools are stable in 22.1. The server reads the Angular workspace and returns compiler output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="30" y="395" width="300" height="260" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="180" y="465" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Agent</text>
    <text x="180" y="535" font-size="30" fill="#57606a" text-anchor="middle">Claude Code</text>
    <text x="180" y="590" font-size="30" fill="#57606a" text-anchor="middle">GitHub Copilot</text>

    <line x1="330" y1="525" x2="466" y2="525" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="400" y="505" font-size="28" fill="#57606a" text-anchor="middle">stdio</text>

    <rect x="470" y="150" width="980" height="750" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="218" font-size="38" font-weight="700" fill="#24292f" text-anchor="middle">Angular CLI MCP server</text>
    <text x="960" y="265" font-size="30" fill="#57606a" text-anchor="middle" font-family="Consolas, monospace">npx @angular/cli mcp</text>

    <rect x="495" y="300" width="450" height="270" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="525" y="355" font-size="32" font-weight="700" fill="#24292f">Inspect</text>
    <g font-family="Consolas, monospace" font-size="27" fill="#24292f">
      <text x="525" y="420">list_projects</text>
      <text x="525" y="470">get_best_practices</text>
      <text x="525" y="520">search_documentation</text>
    </g>

    <rect x="975" y="300" width="450" height="270" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1005" y="355" font-size="32" font-weight="700" fill="#24292f">Dev server</text>
    <rect x="1215" y="322" width="190" height="44" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1310" y="353" font-size="26" fill="#24292f" text-anchor="middle">stable 22.1</text>
    <g font-family="Consolas, monospace" font-size="27" fill="#24292f">
      <text x="1005" y="420">devserver_start</text>
      <text x="1005" y="470">devserver_wait_for_build</text>
      <text x="1005" y="520">devserver_stop</text>
    </g>

    <rect x="495" y="600" width="450" height="270" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="525" y="655" font-size="32" font-weight="700" fill="#24292f">Run</text>
    <rect x="735" y="622" width="190" height="44" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="830" y="653" font-size="26" fill="#24292f" text-anchor="middle">stable 22.1</text>
    <text x="525" y="720" font-size="27" fill="#24292f" font-family="Consolas, monospace">run_target</text>
    <text x="525" y="770" font-size="26" fill="#57606a">build, test, lint</text>

    <rect x="975" y="600" width="450" height="270" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1005" y="655" font-size="32" font-weight="700" fill="#24292f">Guide</text>
    <g font-family="Consolas, monospace" font-size="27" fill="#24292f">
      <text x="1005" y="720">onpush_zoneless_migration</text>
      <text x="1005" y="770">ai_tutor</text>
    </g>

    <line x1="1454" y1="525" x2="1586" y2="525" stroke="#57606a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <rect x="1590" y="335" width="300" height="380" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1740" y="398" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Angular</text>
    <text x="1740" y="440" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">workspace</text>
    <rect x="1615" y="480" width="250" height="80" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1740" y="530" font-size="28" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">angular.json</text>
    <rect x="1615" y="590" width="250" height="80" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1740" y="640" font-size="28" fill="#24292f" text-anchor="middle">compiler output</text>
  </g>
</svg>
