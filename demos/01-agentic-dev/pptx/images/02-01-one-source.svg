<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Harness files for both tools</title>
  <desc>AGENTS.md is the single source, holding the get_best_practices rules plus repo-only rules. CLAUDE.md imports it for Claude Code with @AGENTS.md. GitHub Copilot reads AGENTS.md, plus the repo-wide .github/copilot-instructions.md and scoped .github/instructions/*.instructions.md files with applyTo **/*.html.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="690" y="340" width="540" height="400" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="3"/>
    <text x="960" y="450" font-size="50" font-weight="700" fill="#24292f" font-family="Consolas, monospace">AGENTS.md</text>
    <text x="960" y="505" font-size="30" fill="#57606a">single source</text>
    <line x1="740" y1="545" x2="1180" y2="545" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="610" font-size="28" fill="#24292f"><tspan font-family="Consolas, monospace">get_best_practices</tspan> rules</text>
    <text x="960" y="660" font-size="28" fill="#24292f">+ repo-only rules</text>

    <rect x="40" y="400" width="480" height="280" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="280" y="480" font-size="40" font-weight="700" fill="#24292f" font-family="Consolas, monospace">CLAUDE.md</text>
    <text x="280" y="545" font-size="30" fill="#57606a">Claude Code</text>
    <text x="280" y="610" font-size="28" fill="#24292f">imports <tspan font-family="Consolas, monospace">@AGENTS.md</tspan></text>

    <rect x="1400" y="400" width="480" height="280" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1640" y="500" font-size="36" font-weight="700" fill="#24292f">GitHub Copilot</text>
    <text x="1640" y="570" font-size="28" fill="#24292f">reads <tspan font-family="Consolas, monospace">AGENTS.md</tspan></text>

    <rect x="1400" y="60" width="480" height="190" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="28" fill="#24292f">
      <text x="1640" y="140">.github/</text>
      <text x="1640" y="185">copilot-instructions.md</text>
    </g>

    <rect x="1400" y="830" width="480" height="210" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="28">
      <text x="1640" y="895" fill="#24292f">.github/instructions/</text>
      <text x="1640" y="940" fill="#24292f">*.instructions.md</text>
      <text x="1640" y="1000" fill="#57606a">applyTo: **/*.html</text>
    </g>

    <line x1="690" y1="540" x2="524" y2="540" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1230" y1="540" x2="1396" y2="540" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1640" y1="250" x2="1640" y2="396" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1660" y="334" font-size="28" fill="#57606a" text-anchor="start">repo-wide</text>
    <line x1="1640" y1="830" x2="1640" y2="684" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1660" y="767" font-size="28" fill="#57606a" text-anchor="start">scoped</text>
  </g>
</svg>
