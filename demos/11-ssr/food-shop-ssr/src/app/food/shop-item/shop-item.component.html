<div class="card">
  <div class="card-header">
    <h2 class="card-title">{{ food().name }} - {{ food().price | toEuro }}</h2>
  </div>
  <div class="card-content content">
    <div class="imgContainer">
      <img [ngSrc]="food().pictureUrl ?? ''" width="150" height="110" priority [alt]="food().name" />
    </div>
    <div class="textContainer">
      {{ food().description }}
    </div>
  </div>
  <div class="card-actions justify-end">
    <button
      type="button"
      class="btn-icon details"
      [attr.aria-label]="'Details for ' + food().name"
      [routerLink]="['/food', food().id]"
    >
      <span class="icon">info</span>
    </button>
    <app-number-picker
      [initialValue]="inCart()"
      (amountChanged)="handleAmountChange($event)"
    />
  </div>
</div>
