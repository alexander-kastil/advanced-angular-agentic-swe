<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Render modes per route</title>
  <desc>app.routes.server.ts assigns Prerender, Server or Client per route, with getPrerenderParams and a server fallback.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="80" y="60" width="560" height="200" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="360" y="151" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">''</text>
  <text x="360" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">catalog</text>
  <line x1="640" y1="160" x2="740" y2="160" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="750" y="60" width="1090" height="200" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1295" y="149" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#24292f">RenderMode.Prerender</text>
  <text x="1295" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">build time: a static HTML file</text>
  <rect x="80" y="300" width="560" height="300" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="360" y="441" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">'food/:id'</text>
  <text x="360" y="485" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">detail pages</text>
  <line x1="640" y1="450" x2="740" y2="450" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="750" y="300" width="450" height="300" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="975" y="419" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#24292f">Prerender</text>
  <text x="975" y="461" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">getPrerenderParams()</text>
  <text x="975" y="502" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">ids 1, 2, 3</text>
  <line x1="1200" y1="450" x2="1334" y2="450" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <text x="1267" y="425" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#57606a">unknown id</text>
  <rect x="1340" y="300" width="500" height="300" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="417" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f">fallback:</text>
  <text x="1590" y="459" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#24292f">PrerenderFallback</text>
  <text x="1590" y="501" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#24292f">.Server</text>
  <rect x="80" y="640" width="560" height="160" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="360" y="732" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">'**'</text>
  <line x1="640" y1="720" x2="740" y2="720" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="750" y="640" width="1090" height="160" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1295" y="709" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#24292f">RenderMode.Server</text>
  <text x="1295" y="752" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">per request in Node</text>
  <rect x="750" y="830" width="1090" height="100" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="1295" y="889" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="400" fill="#57606a">RenderMode.Client: the CSR shell</text>
  <rect x="80" y="830" width="560" height="210" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="360" y="901" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#24292f">outputMode: "server"</text>
  <text x="360" y="943" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">missing: the file is</text>
  <text x="360" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#24292f">silently ignored</text>
</svg>
