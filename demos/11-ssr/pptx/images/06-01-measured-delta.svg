<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>CSR versus SSR measured</title>
  <desc>Payload and TTFB for the CSR shell, two prerendered pages and one server-rendered page.</desc>
