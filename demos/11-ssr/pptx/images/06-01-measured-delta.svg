  <text x="920" y="392" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#24292f">89.1</text>
  <rect x="1250" y="330" width="27" height="100" rx="8" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
