<div class="card">
  <div class="card-header">
    <h2 class="card-title">Angular 22 anti-patterns</h2>
  </div>
  <div class="card-content">
    <p>{{ visible().length }} of {{ all().length }} entries</p>
    <div class="filters">
      @for (item of categories(); track item) {
        <button
          type="button"
          class="btn btn-outline"
          [class.selected]="category() === item"
          (click)="category.set(item)"
        >
          {{ item }}
        </button>
      }
    </div>
  </div>
</div>

@for (pattern of visible(); track pattern.id) {
  <div class="card entry">
    <div class="card-header">
      <h2 class="card-title">{{ pattern.category }}</h2>
    </div>
    <div class="card-content">
      <div class="pair">
        <div class="legacy">
          <h3>Avoid</h3>
          <pre>{{ pattern.legacy }}</pre>
        </div>
        <div class="modern">
          <h3>Use</h3>
          <pre>{{ pattern.modern }}</pre>
        </div>
      </div>
      <p class="why">{{ pattern.why }}</p>
    </div>
  </div>
}
