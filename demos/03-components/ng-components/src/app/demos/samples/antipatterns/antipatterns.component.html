<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Angular 22 anti-patterns</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ visible().length }} of {{ all().length }} entries</p>
    <div class="filters">
      @for (item of categories(); track item) {
        <button
          mat-stroked-button
          [class.selected]="category() === item"
          (click)="category.set(item)"
        >
          {{ item }}
        </button>
      }
    </div>
  </mat-card-content>
</mat-card>

@for (pattern of visible(); track pattern.id) {
  <mat-card appearance="outlined" class="entry">
    <mat-card-header>
      <mat-card-title>{{ pattern.category }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="pair">
        <div class="legacy">
          <h4>Avoid</h4>
          <pre>{{ pattern.legacy }}</pre>
        </div>
        <div class="modern">
          <h4>Use</h4>
          <pre>{{ pattern.modern }}</pre>
        </div>
      </div>
      <p class="why">{{ pattern.why }}</p>
    </mat-card-content>
  </mat-card>
}
