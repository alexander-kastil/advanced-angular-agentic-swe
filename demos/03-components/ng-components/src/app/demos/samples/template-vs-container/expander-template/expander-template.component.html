<div class="panel">
  <button
    type="button"
    class="panel-header"
    [attr.aria-expanded]="expanded()"
    (click)="toggleExpander()"
  >
    <span class="panel-title">{{ title() }} - click to {{ expanded() ? "collapse" : "expand" }}</span>
    <span class="icon">{{ expanded() ? "expand_less" : "expand_more" }}</span>
  </button>
  @if (expanded()) {
    <div class="panel-content">
      <ng-container [ngTemplateOutlet]="content()" />
    </div>
  }
</div>
