<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>The current time</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    {{ currentTime() }}
  </mat-card-content>
</mat-card>

<app-expander title="expander using ng-content">
  <app-clock />
</app-expander>

<ng-template #clock>
  <app-clock />
</ng-template>
<app-expander-template title="expander using ng-template" [content]="clock" />
