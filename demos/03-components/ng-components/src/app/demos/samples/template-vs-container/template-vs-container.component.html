<div class="card">
  <div class="card-header">
    <h2 class="card-title">The current time</h2>
  </div>
  <div class="card-content">
    {{ currentTime() }}
  </div>
</div>

<app-expander title="expander using ng-content">
  <app-clock />
</app-expander>

<ng-template #clock>
  <app-clock />
</ng-template>
<app-expander-template title="expander using ng-template" [content]="clock" />
