<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Resources with parameters</title>
  <desc>An input-driven httpResource and a generic resource with params, abortSignal and defaultValue, plus the shared surface.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="120" width="420" height="220" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="220.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">parent</text>
    <text x="270.0" y="264.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">[petId]="petId()"</text>
    <rect x="600" y="120" width="1260" height="220" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1230.0" y="200.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">PetDetail</text>
    <text x="1230.0" y="244.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">petId = input.required&lt;number&gt;()</text>
    <text x="1230.0" y="284.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">pet = httpResource(() =&gt; `pets/${petId()}`)</text>
    <path d="M480,230 L598,230" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1230" y="380" text-anchor="middle" font-size="28" fill="#57606a">petId changes: previous request aborted, refetch</text>
    <rect x="60" y="440" width="1800" height="230" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="960.0" y="525.2" text-anchor="middle" font-size="34" font-family="Consolas, monospace" font-weight="700" fill="#24292f">resource({ params, loader, defaultValue })</text>
    <text x="960.0" y="569.2" text-anchor="middle" font-size="28" fill="#57606a">loader: ({ params, abortSignal }) =&gt; fetch(url, { signal: abortSignal })</text>
    <text x="960.0" y="609.2" text-anchor="middle" font-size="28" fill="#57606a">any promise: IndexedDB, SDK, file system; stream instead of loader</text>
    <rect x="60" y="760" width="560" height="90" rx="45.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="340.0" y="815.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">value()</text>
    <rect x="670" y="760" width="560" height="90" rx="45.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="950.0" y="815.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">status()</text>
    <rect x="1280" y="760" width="560" height="90" rx="45.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1560.0" y="815.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">isLoading()</text>
    <rect x="60" y="880" width="560" height="90" rx="45.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="340.0" y="935.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">error()</text>
    <rect x="670" y="880" width="560" height="90" rx="45.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="950.0" y="935.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">reload()</text>
    <rect x="1280" y="880" width="560" height="90" rx="45.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1560.0" y="935.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">set() / update()</text>
  </g>
</svg>
