<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Built-in control flow</title>
  <desc>Structural directives mapped to the built-in blocks.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="400" y="140" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">before</text>
    <text x="1300" y="140" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Angular 22</text>
    <rect x="120" y="180" width="560" height="100" rx="50.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="400.0" y="240.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">*ngIf</text>
    <rect x="860" y="180" width="900" height="100" rx="50.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1310.0" y="240.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">@if / @else</text>
    <path d="M682,230 L858,230" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="120" y="330" width="560" height="100" rx="50.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="400.0" y="390.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">*ngFor</text>
    <rect x="860" y="330" width="900" height="100" rx="50.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1310.0" y="390.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">@for (...; track id) @empty</text>
    <path d="M682,380 L858,380" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="120" y="480" width="560" height="100" rx="50.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="400.0" y="540.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">[ngSwitch]</text>
    <rect x="860" y="480" width="900" height="100" rx="50.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1310.0" y="540.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">@switch / @case / @default</text>
    <path d="M682,530 L858,530" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="120" y="630" width="560" height="100" rx="50.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="400.0" y="690.5" text-anchor="middle" font-size="30" fill="#24292f">repeated expression</text>
    <rect x="860" y="630" width="900" height="100" rx="50.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1310.0" y="690.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">@let average = ...</text>
    <path d="M682,680 L858,680" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="120" y="780" width="560" height="100" rx="50.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="400.0" y="840.5" text-anchor="middle" font-size="30" fill="#24292f">lazy block</text>
    <rect x="860" y="780" width="900" height="100" rx="50.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1310.0" y="840.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">@defer (on interaction)</text>
    <path d="M682,830 L858,830" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="960" y="1000" text-anchor="middle" font-size="28" fill="#57606a">ng g @angular/core:control-flow migrates existing templates</text>
  </g>
</svg>
