    <text x="1710.0" y="849.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f"></text>
    <text x="1710" y="825" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">receipts</text>
    <text x="1710" y="875" text-anchor="middle" font-size="26" fill="#57606a">build + empty grep</text>
