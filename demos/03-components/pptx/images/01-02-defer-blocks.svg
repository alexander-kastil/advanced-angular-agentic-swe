<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Defer triggers and timings</title>
  <desc>placeholder, trigger, loading with after and minimum, deferred content, error on a failed import.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="180" width="380" height="220" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="250.0" y="280.8" text-anchor="middle" font-size="36" font-family="Consolas, monospace" font-weight="700" fill="#24292f">@placeholder</text>
    <text x="250.0" y="324.8" text-anchor="middle" font-size="28" fill="#57606a">minimum</text>
    <rect x="540" y="180" width="380" height="220" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="730.0" y="280.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">trigger fires</text>
    <text x="730.0" y="324.8" text-anchor="middle" font-size="28" fill="#57606a">on idle (default)</text>
    <rect x="1020" y="180" width="380" height="220" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1210.0" y="260.8" text-anchor="middle" font-size="36" font-family="Consolas, monospace" font-weight="700" fill="#24292f">@loading</text>
    <text x="1210.0" y="304.8" text-anchor="middle" font-size="28" fill="#57606a">after 100ms</text>
    <text x="1210.0" y="344.8" text-anchor="middle" font-size="28" fill="#57606a">minimum 500ms</text>
    <rect x="1500" y="180" width="360" height="220" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1680.0" y="280.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">content</text>
    <text x="1680.0" y="324.8" text-anchor="middle" font-size="28" fill="#57606a">the lazy chunk</text>
    <path d="M440,290 L538,290" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M920,290 L1018,290" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1400,290 L1498,290" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1020" y="520" width="380" height="160" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1210.0" y="590.8" text-anchor="middle" font-size="36" font-family="Consolas, monospace" font-weight="700" fill="#24292f">@error</text>
    <text x="1210.0" y="634.8" text-anchor="middle" font-size="28" fill="#57606a">import rejected</text>
    <path d="M1210,402 L1210,518" fill="none" stroke="#c24141" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="60" y="560" width="280" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="200.0" y="609.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">on timer(3s)</text>
    <rect x="360" y="560" width="280" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="500.0" y="609.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">on viewport</text>
    <rect x="660" y="560" width="280" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="800.0" y="609.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">on interaction</text>
    <rect x="60" y="670" width="280" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="200.0" y="719.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">on hover</text>
    <rect x="360" y="670" width="280" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="500.0" y="719.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">on immediate</text>
    <rect x="660" y="670" width="280" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="800.0" y="719.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">when expr</text>
    <rect x="60" y="820" width="960" height="90" rx="45.0" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="540.0" y="874.8" text-anchor="middle" font-size="28" fill="#24292f">prefetch on idle: fetch early, render on trigger</text>
    <text x="960" y="990" text-anchor="middle" font-size="28" fill="#57606a">triggers combine with ; and are ORed</text>
  </g>
</svg>
