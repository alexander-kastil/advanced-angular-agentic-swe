<nav class="topbar" aria-label="Main">
  <button type="button" class="hamburgerMenu rail-btn text-white hover:bg-white/15 hover:text-white" aria-label="Toggle navigation" (click)="toggleMenu()">
    <span class="icon" aria-hidden="true">menu</span>
  </button>
  <img class="mr-2 ml-1" width="34" height="34" src="images/angular.svg" alt="Angular" />
  <div class="menuContainer">
    @for (mi of menuItems(); track mi) {
      <a
        class="topbar-link"
        routerLink="{{ '/' + mi.url }}"
        routerLinkActive="topbar-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ mi.label }}
      </a>
    }
  </div>
  <app-loading />
  <button type="button" class="hamburgerMenu rail-btn text-white hover:bg-white/15 hover:text-white" aria-label="Apps" (click)="toggleApps()">
    <span class="icon" aria-hidden="true">apps</span>
  </button>
</nav>
