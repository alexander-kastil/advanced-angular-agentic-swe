<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Testing tools the way an agent calls them</title>
<desc>Vitest stubs navigator.modelContext and asserts rows after calling a tool; Playwright installs a bridge with addInitScript and calls tools against the real bundle.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<text x="60" y="80" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">Vitest unit spec</text>
<rect x="40" y="120" width="400" height="200" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="240.0" y="202.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">stub</text>
<text x="240.0" y="245.5" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">modelContext</text>
<line x1="444" y1="220" x2="516" y2="220" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="520" y="120" width="400" height="200" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="720.0" y="202.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">capture</text>
<text x="720.0" y="245.5" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">registerTool</text>
<line x1="924" y1="220" x2="996" y2="220" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1000" y="120" width="400" height="200" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1200.0" y="202.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">add_book</text>
<text x="1200.0" y="245.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">.execute()</text>
<line x1="1404" y1="220" x2="1476" y2="220" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1480" y="120" width="400" height="200" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1680.0" y="202.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">TestBed.tick()</text>
<text x="1680.0" y="245.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">3 rows</text>
<rect x="40" y="360" width="1840" height="110" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
<text x="960.0" y="418.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">fixture.destroy()  -&gt;  every AbortSignal aborted</text>
<text x="60" y="580" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">Playwright end to end</text>
<rect x="40" y="620" width="400" height="220" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="240.0" y="712.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">addInitScript</text>
<text x="240.0" y="755.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">capturing bridge</text>
<line x1="444" y1="730" x2="516" y2="730" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="520" y="620" width="400" height="220" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="720.0" y="712.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">real bundle,</text>
<text x="720.0" y="755.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">router, rendering</text>
<line x1="924" y1="730" x2="996" y2="730" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1000" y="620" width="400" height="220" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1200.0" y="712.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">callTool(</text>
<text x="1200.0" y="755.5" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">'add_book')</text>
<line x1="1404" y1="730" x2="1476" y2="730" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1480" y="620" width="400" height="220" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1680.0" y="712.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">rows()</text>
<text x="1680.0" y="755.5" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">toHaveCount(3)</text>
<text x="960" y="960" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#57606a">invoke the tool, then assert the page</text>
</svg>
