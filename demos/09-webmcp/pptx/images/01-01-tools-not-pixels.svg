<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Declared tools instead of DOM guessing</title>
<desc>Left: a browser agent screenshots and clicks pixels. Right: the page declares tools into modelContext and the agent calls them from tools/list.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="40" y="40" width="720" height="1000" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
<text x="400" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">Agent drives the DOM</text>
<rect x="120" y="180" width="560" height="150" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="400.0" y="259.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">screenshot the page</text>
<line x1="400" y1="334" x2="400" y2="402" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="120" y="410" width="560" height="150" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="400.0" y="489.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">guess the label</text>
<line x1="400" y1="564" x2="400" y2="632" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="120" y="640" width="560" height="150" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="400.0" y="719.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">click a pixel</text>
<rect x="159.82" y="914" width="480.36" height="52" rx="26" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
<text x="400" y="949" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">fragile when the layout moves</text>
<rect x="840" y="40" width="1040" height="1000" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1360" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">Page declares tools</text>
<rect x="900" y="170" width="420" height="200" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1110.0" y="238.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f">Angular app</text>
<text x="1110.0" y="290.79999999999995" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#24292f">declareExperimental</text>
<text x="1110.0" y="328.49999999999994" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#24292f">WebMcpTool()</text>
<rect x="1420" y="170" width="400" height="200" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1620.0" y="252.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">modelContext</text>
<text x="1620.0" y="295.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">registerTool()</text>
<line x1="1324" y1="270" x2="1412" y2="270" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="900" y="450" width="920" height="250" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1360.0" y="538.3" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700" fill="#24292f">tools/list</text>
<text x="1360.0" y="597.0999999999999" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">name   description   inputSchema</text>
<text x="1360.0" y="640.5999999999999" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">all the agent ever sees</text>
<line x1="1620" y1="374" x2="1620" y2="442" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="900" y="780" width="920" height="200" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1360.0" y="860.8000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">agent calls the tool:</text>
<text x="1360.0" y="907.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">same method the button runs</text>
<line x1="1360" y1="704" x2="1360" y2="772" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
</svg>
