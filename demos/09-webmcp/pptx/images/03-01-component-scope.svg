<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Tools scoped to a component</title>
<desc>Constructor registers add_task; agent and user both update the tasks signal; destroying the component unregisters the tool and aborts its signal.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="40" y="380" width="420" height="260" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="250.0" y="516.8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">navigate in</text>
<line x1="464" y1="510" x2="516" y2="510" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="520" y="380" width="420" height="260" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="730.0" y="473.29999999999995" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">constructor</text>
<text x="730.0" y="532.0999999999999" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">add_task</text>
<text x="730.0" y="575.5999999999999" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">registered</text>
<line x1="944" y1="510" x2="996" y2="510" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1000" y="380" width="420" height="260" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1210.0" y="495.04999999999995" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">tasks signal</text>
<text x="1210.0" y="553.8499999999999" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">tasks.update()</text>
<line x1="1424" y1="510" x2="1476" y2="510" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1480" y="380" width="420" height="260" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="1690.0" y="495.04999999999995" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">navigate away</text>
<text x="1690.0" y="553.8499999999999" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">injector destroyed</text>
<rect x="560" y="80" width="380" height="180" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="750.0" y="156.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">agent</text>
<text x="750.0" y="212.4" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">calls add_task</text>
<rect x="1040" y="80" width="380" height="180" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1230.0" y="155.05" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">user</text>
<text x="1230.0" y="213.85000000000002" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">clicks Add</text>
<line x1="750" y1="264" x2="1100" y2="372" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<line x1="1230" y1="264" x2="1200" y2="372" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1480" y="760" width="400" height="220" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
<text x="1680.0" y="830.25" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">tool unregistered,</text>
<text x="1680.0" y="873.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">AbortSignal</text>
<text x="1680.0" y="917.25" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">aborted</text>
<line x1="1680" y1="644" x2="1680" y2="752" stroke="#c24141" stroke-width="4" marker-end="url(#a-r)"/>
<rect x="40" y="760" width="1360" height="220" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="720.0" y="850.8000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">one source of truth: the template renders the</text>
<text x="720.0" y="897.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">same signal the tool writes</text>
</svg>
