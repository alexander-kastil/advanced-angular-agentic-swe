<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Signals as WebMCP tools</title>
<desc>read_counter reads and set_counter writes one counter signal; the template follows; a route provides a page-level tool.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="60" y="120" width="520" height="360" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="320.0" y="269.5" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">read_counter</text>
<text x="320.0" y="323.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">inputSchema: {}</text>
<text x="320.0" y="361.09999999999997" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#24292f">execute: () =&gt; counter()</text>
<rect x="700" y="160" width="520" height="280" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="960.0" y="276.0" text-anchor="middle" font-family="Consolas, monospace" font-size="40" fill="#24292f">counter =</text>
<text x="960.0" y="334.0" text-anchor="middle" font-family="Consolas, monospace" font-size="40" fill="#24292f">signal(0)</text>
<rect x="1340" y="120" width="520" height="360" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1600.0" y="266.6" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">set_counter</text>
<text x="1600.0" y="323.40000000000003" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">value: number</text>
<text x="1600.0" y="364.00000000000006" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">counter.set(value)</text>
<line x1="692" y1="300" x2="588" y2="300" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<text x="640.0" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">reads</text>
<line x1="1332" y1="300" x2="1228" y2="300" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<text x="1280.0" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">writes</text>
<rect x="700" y="560" width="520" height="160" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="960.0" y="622.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">{{ counter() }}</text>
<text x="960.0" y="665.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">template updates</text>
<line x1="960" y1="444" x2="960" y2="552" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="60" y="820" width="1800" height="180" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
<text x="960.0" y="892.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">providers: [provideExperimentalWebMcpTools([describe_signals_demo])]</text>
<text x="960.0" y="935.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">page-level tool on the route</text>
</svg>
