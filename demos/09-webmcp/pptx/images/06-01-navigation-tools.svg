<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>The router as agent tools</title>
<desc>list_demos for discovery, navigate_to_demo for action with the outcome returned, current_route for orientation; guards stay the authorization boundary.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="40" y="100" width="560" height="440" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="320.0" y="261.95" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">list_demos</text>
<text x="320.0" y="321.65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">discover:</text>
<text x="320.0" y="365.15" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">titles, topics,</text>
<text x="320.0" y="408.65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">route segments</text>
<line x1="604" y1="320" x2="676" y2="320" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="680" y="100" width="560" height="440" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="960.0" y="261.95" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">navigate_to_demo</text>
<text x="960.0" y="321.65" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">{ url }</text>
<text x="960.0" y="365.15" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">router.navigate()</text>
<text x="960.0" y="408.65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">returns the outcome</text>
<line x1="1244" y1="320" x2="1316" y2="320" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1320" y="100" width="560" height="440" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1600.0" y="283.7" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">current_route</text>
<text x="1600.0" y="343.4" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">confirm:</text>
<text x="1600.0" y="386.9" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">Router.url</text>
<rect x="680" y="680" width="560" height="180" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
<text x="960.0" y="755.05" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">route guard</text>
<text x="960.0" y="813.8499999999999" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">canActivate</text>
<line x1="960" y1="544" x2="960" y2="672" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<text x="1160" y="620" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a">false when blocked</text>
<text x="960" y="960" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">a tool call is not an authorization boundary: the guards are</text>
</svg>
