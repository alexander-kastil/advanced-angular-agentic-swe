<div class="container">
  @if (item.value(); as food) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ food.name }}</mat-card-title>
        <mat-card-subtitle>
          {{ food.price | toEuro }} &middot; {{ food.inStock }} in stock
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ food.description }}</p>
      </mat-card-content>
    </mat-card>
  } @else {
    <p>No dish found for this id.</p>
  }
  <button mat-raised-button routerLink="/">Go back</button>
</div>
