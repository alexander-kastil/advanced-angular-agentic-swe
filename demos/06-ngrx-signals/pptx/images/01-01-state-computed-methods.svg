<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>State, derived state and methods</title>
  <desc>withState properties become signals, withComputed derives read-only signals, withMethods changes state with patchState. getState returns a live snapshot; the store is scoped by component providers or providedIn root.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="60" width="560" height="560" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="130" font-size="36" font-weight="700" fill="#24292f" font-family="Consolas, monospace">withState</text>
    <text x="80" y="175" font-size="28" fill="#57606a">each property is a signal</text>
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f">
      <text x="80" y="260">appTitle()</text>
      <text x="80" y="330">darkMode()</text>
      <text x="80" y="400">density()</text>
      <text x="80" y="470">pageSize()</text>
    </g>
    <rect x="680" y="60" width="560" height="560" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="720" y="130" font-size="36" font-weight="700" fill="#24292f" font-family="Consolas, monospace">withComputed</text>
    <text x="720" y="175" font-size="28" fill="#57606a">read-only, recalculates</text>
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f">
      <text x="720" y="260">summary()</text>
      <text x="720" y="330">rowHeight()</text>
    </g>
    <rect x="1320" y="60" width="560" height="560" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1360" y="130" font-size="36" font-weight="700" fill="#24292f" font-family="Consolas, monospace">withMethods</text>
    <text x="1360" y="175" font-size="28" fill="#57606a">the only writer</text>
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f">
      <text x="1360" y="260">toggleDarkMode()</text>
      <text x="1360" y="330">setDensity(d)</text>
      <text x="1360" y="400">reset()</text>
    </g>
    <rect x="1360" y="470" width="480" height="100" rx="14" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
    <text x="1600" y="533" font-size="30" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">patchState(store, ...)</text>
    <line x1="600" y1="340" x2="672" y2="340" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M1600 620 V655 H320 V630" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
    <rect x="40" y="690" width="880" height="320" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="760" font-size="34" font-weight="700" fill="#24292f" font-family="Consolas, monospace">getState(store)</text>
    <text x="80" y="815" font-size="28" fill="#57606a">reactive snapshot of the whole state</text>
    <text x="80" y="900" font-size="28" fill="#24292f" font-family="Consolas, monospace">{ "appTitle": "NgRx SignalStore",</text>
    <text x="80" y="945" font-size="28" fill="#24292f" font-family="Consolas, monospace">  "darkMode": true, ... }</text>
    <rect x="1000" y="690" width="880" height="320" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1040" y="760" font-size="34" font-weight="700" fill="#24292f">Scope</text>
    <text x="1040" y="840" font-size="30" fill="#24292f" font-family="Consolas, monospace">providers: [AppSettingsStore]</text>
    <text x="1040" y="885" font-size="28" fill="#57606a">lives with the page</text>
    <text x="1040" y="950" font-size="30" fill="#24292f" font-family="Consolas, monospace">{ providedIn: 'root' }</text>
    <text x="1040" y="992" font-size="28" fill="#57606a">outlives the route</text>
  </g>
</svg>
