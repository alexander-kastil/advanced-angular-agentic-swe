<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>An event-based store</title>
  <desc>A component dispatches [Cart] added through injectDispatch onto the Dispatcher. withReducer changes state; withEventHandlers maps checkoutStarted to checkoutFinished, which returns to the bus. provideDispatcher creates a child scope; scope self stays local, parent goes up one level, global reaches the root.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="80" width="400" height="200" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="240" y="160" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Component</text>
    <text x="240" y="220" font-size="26" fill="#57606a" text-anchor="middle" font-family="Consolas, monospace">dispatch.added(item)</text>
    <line x1="440" y1="180" x2="552" y2="180" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="560" y="80" width="560" height="200" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="840" y="160" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Dispatcher</text>
    <text x="840" y="220" font-size="28" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">[Cart] added</text>
    <path d="M700 280 V400" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <path d="M980 280 V400" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="410" width="760" height="260" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="475" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">withReducer</text>
    <text x="80" y="535" font-size="28" fill="#24292f" font-family="Consolas, monospace">on(added) =&gt; lines, log</text>
    <text x="80" y="585" font-size="28" fill="#24292f" font-family="Consolas, monospace">on(checkoutFinished)</text>
    <text x="80" y="635" font-size="26" fill="#57606a">changes state</text>
    <rect x="840" y="410" width="560" height="260" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="880" y="475" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">withEventHandlers</text>
    <text x="880" y="535" font-size="28" fill="#24292f" font-family="Consolas, monospace">checkoutStarted</text>
    <text x="880" y="585" font-size="28" fill="#24292f" font-family="Consolas, monospace">=&gt; checkoutFinished</text>
    <text x="880" y="635" font-size="26" fill="#57606a">emits new events</text>
    <path d="M1400 540 H1480 V180 H1128" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
    <text x="1500" y="370" font-size="26" fill="#57606a">back to the bus</text>
    <rect x="40" y="740" width="1840" height="290" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="805" font-size="32" font-weight="700" fill="#24292f">Scope with</text>
    <text x="270" y="805" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">provideDispatcher()</text>
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f" text-anchor="middle">
      <rect x="80" y="850" width="520" height="130" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
      <text x="340" y="905">self</text>
      <rect x="700" y="850" width="520" height="130" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
      <text x="960" y="905">parent</text>
      <rect x="1320" y="850" width="520" height="130" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
      <text x="1580" y="905">global</text>
    </g>
    <g font-size="26" fill="#57606a" text-anchor="middle">
      <text x="340" y="950">reduced locally</text>
      <text x="960" y="950">one level up</text>
      <text x="1580" y="950">the root dispatcher</text>
    </g>
  </g>
</svg>
