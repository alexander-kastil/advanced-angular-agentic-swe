<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Normalized collections with withEntities</title>
  <desc>withEntities adds entityMap and ids, and derives entities from both. Pure updaters such as setAllEntities, addEntity, updateEntity, updateAllEntities, removeEntity and removeAllEntities are passed to patchState.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="60" width="860" height="960" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="130" font-size="36" font-weight="700" fill="#24292f" font-family="Consolas, monospace">withEntities&lt;Task&gt;()</text>
    <rect x="80" y="180" width="380" height="260" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="110" y="240" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">entityMap</text>
    <text x="110" y="300" font-size="28" fill="#57606a" font-family="Consolas, monospace">1: Write slides</text>
    <text x="110" y="350" font-size="28" fill="#57606a" font-family="Consolas, monospace">2: Run demo</text>
    <rect x="490" y="180" width="370" height="260" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="520" y="240" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">ids</text>
    <text x="520" y="300" font-size="28" fill="#57606a" font-family="Consolas, monospace">[1, 2]</text>
    <line x1="270" y1="440" x2="420" y2="552" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <line x1="675" y1="440" x2="525" y2="552" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="200" y="560" width="540" height="130" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="470" y="640" font-size="34" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">entities()</text>
    <text x="80" y="780" font-size="28" fill="#57606a">ordered by ids, read in the template</text>
    <text x="80" y="850" font-size="28" fill="#24292f" font-family="Consolas, monospace">@for (t of store.entities();</text>
    <text x="80" y="895" font-size="28" fill="#24292f" font-family="Consolas, monospace">      track t.id)</text>
    <text x="980" y="130" font-size="36" font-weight="700" fill="#24292f">Updaters for patchState</text>
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f">
      <rect x="980" y="180" width="900" height="90" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="238">setAllEntities(list)</text>
      <rect x="980" y="290" width="900" height="90" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="348">addEntity(item)</text>
      <rect x="980" y="400" width="900" height="90" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
      <text x="1010" y="458">updateEntity({ id, changes })</text>
      <rect x="980" y="510" width="900" height="90" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="568">updateAllEntities(changes)</text>
      <rect x="980" y="620" width="900" height="90" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="678">removeEntity(id)</text>
      <rect x="980" y="730" width="900" height="90" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="788">removeAllEntities()</text>
    </g>
    <text x="980" y="890" font-size="28" fill="#57606a">changes: a partial object</text>
    <text x="980" y="935" font-size="28" fill="#57606a">or a function of the entity</text>
  </g>
</svg>
