<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Resource extensions</title>
  <desc>A plain httpResource blanks its value while reloading and throws on error. extendResource with withPreviousValueOnLoading keeps the last list while loading, and withValueOnError returns an empty array on error. provideResourceExtensions sets scoped defaults.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">
      <text x="760" y="80">resolved</text>
      <text x="1180" y="80">loading</text>
      <text x="1600" y="80">error</text>
    </g>
    <rect x="40" y="120" width="1840" height="300" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="200" font-size="32" font-weight="700" fill="#24292f">Plain</text>
    <text x="80" y="250" font-size="28" fill="#24292f" font-family="Consolas, monospace">httpResource</text>
    <rect x="580" y="170" width="360" height="200" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="760" y="285" font-size="30" fill="#24292f" text-anchor="middle">12 topics</text>
    <rect x="1000" y="170" width="360" height="200" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="1180" y="285" font-size="30" fill="#57606a" text-anchor="middle" font-family="Consolas, monospace">undefined</text>
    <rect x="1420" y="170" width="360" height="200" rx="14" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1600" y="285" font-size="30" fill="#24292f" text-anchor="middle">throws on read</text>
    <rect x="40" y="470" width="1840" height="380" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="545" font-size="32" font-weight="700" fill="#24292f">Extended</text>
    <text x="80" y="595" font-size="28" fill="#24292f" font-family="Consolas, monospace">extendResource</text>
    <rect x="580" y="530" width="360" height="200" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="760" y="645" font-size="30" fill="#24292f" text-anchor="middle">12 topics</text>
    <rect x="1000" y="530" width="360" height="200" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1180" y="625" font-size="30" fill="#24292f" text-anchor="middle">12 topics</text>
    <text x="1180" y="672" font-size="26" fill="#57606a" text-anchor="middle">previous value</text>
    <rect x="1420" y="530" width="360" height="200" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1600" y="625" font-size="30" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">[]</text>
    <text x="1600" y="672" font-size="26" fill="#57606a" text-anchor="middle">fallback value</text>
    <text x="1180" y="800" font-size="26" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">withPreviousValueOnLoading()</text>
    <text x="1600" y="800" font-size="26" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">withValueOnError([])</text>
    <rect x="40" y="900" width="1840" height="130" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="980" font-size="30" fill="#24292f" font-family="Consolas, monospace">provideResourceExtensions(...)</text>
    <text x="960" y="980" font-size="28" fill="#57606a">house defaults for an app, route or component</text>
  </g>
</svg>
