<div class="card max-w-xl">
  <div class="card-header">
    <div class="card-title">{{ isNew ? 'Add Skill' : 'Edit Skill' }}</div>
  </div>
  <div class="card-content flex flex-col gap-3">
    <div class="field">
      <label class="label" for="skill-name">Name</label>
      <input id="skill-name" class="input" type="text" placeholder="Name" [formField]="skillForm.name" />
    </div>
    @if (skillForm.name().touched() && skillForm.name().invalid()) {
      @for (err of skillForm.name().errors(); track err.kind) {
        <div class="error">{{ err.message }}</div>
      }
    }
    <label class="switch">
      <input type="checkbox" class="sr-only" [formField]="skillForm.completed" />
      <span class="switch-track"><span class="switch-thumb"></span></span>
      Completed
    </label>
  </div>
  <div class="card-actions justify-end">
    <button type="button" class="btn btn-primary" (click)="doCancel()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="saveSkill()">Save</button>
  </div>
</div>
