<div class="app-toolbar justify-between">
  <div class="title">SPA Skills</div>
  <div class="flex items-center gap-4">
    <button type="button" class="btn btn-primary" (click)="addItem()">Add</button>
    <app-slide-toggle [checked]="store.showAll()" (toggled)="store.toggleShowAll()">
      ShowAll
    </app-slide-toggle>
  </div>
</div>
<div class="skillrow header">
  <div class="id">ID</div>
  <div class="name">Name</div>
  <div class="completed">Completed</div>
  <div class="cmd">Actions</div>
</div>
@if (store.isPending()) {
  <p>Loading skills...</p>
}
@if (store.error(); as err) {
  <p class="error">{{ err }}</p>
}
@for (sk of store.visibleSkills(); track sk.id) {
  <app-skill-row [skill]="sk"
    (itemDeleted)="deleteItem($event)"
    (itemCompleted)="toggleItemComplete($event)"
   />
}
<app-skills-kpi />
