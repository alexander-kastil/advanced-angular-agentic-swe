<div class="page">
  @if (store.loading()) {
    <app-progress-bar />
  }
  <div class="overflow-hidden rounded-lg border border-line bg-white shadow-sm">
    @for (c of customers(); track c) {
      <div class="row">
        <div class="font-medium">{{ c.name }}</div>
        <button
          type="button"
          class="btn btn-outline"
          [routerLink]="['/customers', c.id]"
          [queryParams]="{ readonly: true }"
        >
          Edit
        </button>
      </div>
    } @empty {
      <p class="px-4 py-3 text-sm text-slate-500">No customers loaded.</p>
    }
  </div>
</div>
