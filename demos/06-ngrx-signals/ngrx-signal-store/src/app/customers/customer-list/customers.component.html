@if(store.loading()){
<app-progress-bar />
} @for (c of customers(); track c) {
<div class="box row">
  <div>{{ c.name }}</div>
  <div>
    <button
      type="button"
      class="btn btn-primary"
      [routerLink]="['/customers', c.id]"
      [queryParams]="{ readonly: true }"
    >
      Edit
    </button>
  </div>
</div>
}
