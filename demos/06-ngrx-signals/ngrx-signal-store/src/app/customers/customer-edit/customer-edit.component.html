<div class="box">
  <form class="flex max-w-md flex-col gap-3" [formGroup]="customersForm" (ngSubmit)="updateCustomer()">
    <div class="field">
      <label class="label" for="customer-id">Id</label>
      <input id="customer-id" class="input" formControlName="id" readonly />
    </div>
    <div class="field">
      <label class="label" for="customer-name">Name</label>
      <input id="customer-name" class="input" formControlName="name" />
    </div>
    <button type="submit" class="btn btn-primary self-start">Save</button>
  </form>
</div>
