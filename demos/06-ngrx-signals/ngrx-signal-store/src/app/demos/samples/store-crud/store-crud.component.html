<div class="card">
  <div class="card-header">
    <div class="card-title">Customers - CRUD with withMethods and rxMethod</div>
  </div>
  <div class="card-content content">
    @if (store.loading()) {
      <app-progress-bar />
    }

    <div class="toolbar">
      <div class="field">
        <label class="label" for="crud-search">Search</label>
        <input id="crud-search" class="input" [ngModel]="store.filter()" (ngModelChange)="store.setFilter($event)" />
      </div>
      <div class="field">
        <label class="label" for="crud-new">New customer</label>
        <input id="crud-new" class="input" [ngModel]="newName()" (ngModelChange)="newName.set($event)" (keyup.enter)="add()" />
      </div>
      <button type="button" class="btn btn-primary self-end" (click)="add()">Add</button>
    </div>

    @for (c of store.filtered(); track c.id) {
      <div class="row">
        @if (editing()?.id === c.id) {
          <div class="field grow">
            <label class="label">Name</label>
            <input class="input" [ngModel]="editing()!.name" (ngModelChange)="rename($event)" (keyup.enter)="saveEdit()" />
          </div>
          <button type="button" class="btn-icon" (click)="saveEdit()"><span class="icon">done</span></button>
          <button type="button" class="btn-icon" (click)="editing.set(null)"><span class="icon">close</span></button>
        } @else {
          <span class="grow">#{{ c.id }} {{ c.name }}</span>
          <button type="button" class="btn-icon" (click)="startEdit(c)"><span class="icon">edit</span></button>
          <button type="button" class="btn-icon" (click)="remove(c)"><span class="icon">delete</span></button>
        }
      </div>
    } @empty {
      <p>No customers match the current filter.</p>
    }

    <p>Total: <strong>{{ store.count() }}</strong> - next id: <strong>{{ store.nextId() }}</strong></p>
  </div>
</div>
