<div class="panel">
  <button type="button" class="panel-header" (click)="togglePanel()">
    <span class="panel-title">Instructions</span>
    <span class="icon">{{ contentVisible() ? 'expand_less' : 'expand_more' }}</span>
  </button>
  @if (contentVisible()) {
    <div class="panel-content">
      <markdown mermaid [src]="markdownSrc()" (load)="onMarkdownLoad()" />
    </div>
  }
</div>
