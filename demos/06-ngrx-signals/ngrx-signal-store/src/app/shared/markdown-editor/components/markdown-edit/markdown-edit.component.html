<div column class="gap-3">
  <div class="field">
    <label class="label">Title</label>
    @if (markdownItem().id === -1) {
      <input class="input" [value]="markdownItem().title" readonly />
    } @else {
      <input class="input" [formField]="itemForm.title" />
    }
  </div>
  <div class="field">
    <label class="label">Comment</label>
    <textarea class="textarea" autosize [formField]="itemForm.comment"></textarea>
  </div>
</div>
