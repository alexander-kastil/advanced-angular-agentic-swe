<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Virtual scroll viewport</title>
  <desc>Out of 100000 rows only the visible slice plus a buffer is rendered.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="260" y="50" width="420" height="980" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="70" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="117" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="164" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="211" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="258" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="305" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="352" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="399" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="446" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="493" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="540" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="587" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="634" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="681" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="728" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="775" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="822" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="869" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="916" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="290" y="963" width="360" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="470" y="1060" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#57606a">100 000 rows</text>
  <rect x="240" y="390" width="460" height="330" rx="14" fill="#eaf2ff" stroke="#2f6fd6" stroke-width="4"/>
  <rect x="270" y="410" width="400" height="36" rx="6" fill="#ffffff" stroke="#2f6fd6" stroke-width="2"/>
  <rect x="270" y="460" width="400" height="36" rx="6" fill="#ffffff" stroke="#2f6fd6" stroke-width="2"/>
  <rect x="270" y="510" width="400" height="36" rx="6" fill="#ffffff" stroke="#2f6fd6" stroke-width="2"/>
  <rect x="270" y="560" width="400" height="36" rx="6" fill="#ffffff" stroke="#2f6fd6" stroke-width="2"/>
