  <rect x="270" y="660" width="400" height="36" rx="6" fill="#ffffff" stroke="#2f6fd6" stroke-width="2"/>
  <text x="810" y="525" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2f6fd6">rendered range</text>
  <line x1="704" y1="555" x2="900" y2="555" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="910" y="120" width="900" height="180" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1360" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">itemSize = real row height in px</text>
  <text x="1360" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">wrong value: wrong scrollbar, jumping list</text>
  <rect x="910" y="340" width="900" height="180" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1360" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">viewport needs an explicit height</text>
  <text x="1360" y="461" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">without it nothing renders</text>
  <rect x="910" y="560" width="900" height="180" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1360" y="640" text-anchor="middle" font-family="Consolas, monospace" font-size="32" font-weight="600" fill="#24292f">renderedRangeChange</text>
  <text x="1360" y="681" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">start and end into a signal</text>
  <rect x="910" y="780" width="900" height="180" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1360" y="860" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">under ~100 rows: render them all</text>
  <text x="1360" y="901" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">virtual scroll also breaks Ctrl+F</text>
</svg>
