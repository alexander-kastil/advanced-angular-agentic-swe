<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Rolldown pipeline and budgets</title>
  <desc>The Angular 22 build pipeline with Rolldown owning the module graph, and two size budgets plus a lazy chunk.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="100" y="70" width="620" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="410" y="137" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">oxc-parser</text>
  <text x="410" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">parse</text>
  <line x1="410" y1="220" x2="410" y2="266" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="100" y="270" width="620" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="410" y="337" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">compiler-cli</text>
  <text x="410" y="376" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">AOT compile</text>
  <line x1="410" y1="420" x2="410" y2="466" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="100" y="470" width="620" height="150" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="410" y="537" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">Rolldown</text>
  <text x="410" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">graph, split, tree shake</text>
  <line x1="410" y1="620" x2="410" y2="666" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="100" y="670" width="620" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="410" y="737" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">esbuild</text>
  <text x="410" y="776" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">transform, minify</text>
  <line x1="720" y1="745" x2="886" y2="745" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="890" y="680" width="300" height="130" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1040" y="757" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">dist/</text>
  <rect x="1300" y="70" width="520" height="230" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1560" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">initial</text>
  <text x="1560" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f">warn 1MB  ·  error 2MB</text>
  <text x="1560" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">decides LCP</text>
  <rect x="1300" y="340" width="520" height="230" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1560" y="443" text-anchor="middle" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#24292f">anyComponentStyle</text>
  <text x="1560" y="487" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f">warn 4kB  ·  error 8kB</text>
  <rect x="1300" y="610" width="520" height="300" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1560" y="707" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">lazy chunk</text>
  <text x="1560" y="750" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="400" fill="#24292f">await import('moment')</text>
  <text x="1560" y="792" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">downloads only when</text>
  <text x="1560" y="834" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a">the method runs</text>
  <line x1="1190" y1="745" x2="1296" y2="745" stroke="#57606a" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#a-grey)"/>
  <text x="1010" y="990" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#57606a">budgets turn a size regression into a failed build</text>
</svg>
