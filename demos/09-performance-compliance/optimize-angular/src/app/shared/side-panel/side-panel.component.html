<mat-toolbar color="accent">
  <mat-toolbar-row>
    <button type="button"
      mat-mini-fab
      matTooltip="Toggle the SideNav"
      aria-label="Toggle the SideNav"
      (click)="toggleSideNav()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    @if (isDemosRoute() && layout.hasMarkdownContent()) {
      <button type="button"
        mat-mini-fab
        matTooltip="Toggle Markdown Guide"
        aria-label="Toggle Markdown Guide"
        (click)="showGuide()"
      >
        <mat-icon>help_clinic</mat-icon>
      </button>
      <button type="button"
        mat-mini-fab
        [matTooltip]="isEditorActive() ? 'Close Editor' : 'Open Editor'"
        [attr.aria-label]="isEditorActive() ? 'Close Editor' : 'Open Editor'"
        (click)="toggleEditor()"
      >
        <mat-icon>{{ isEditorActive() ? "cancel" : "edit_square" }}</mat-icon>
      </button>
      @if (isEditorActive()) {
        <button type="button"
          mat-mini-fab
          matTooltip="Add Comment"
          aria-label="Add Comment"
          (click)="addMarkdownItem()"
        >
          <mat-icon>add</mat-icon>
        </button>
      }
    }
  </mat-toolbar-row>
</mat-toolbar>
