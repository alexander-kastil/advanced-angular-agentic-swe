<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button type="button" (click)="toggleMenu()" class="hamburgerMenu" aria-label="Toggle the main menu">
      <mat-icon color="accent">menu</mat-icon>
    </button>
    <div><img width="50px" src="images/angular.svg" alt="Angular logo" /></div>
    <div class="menuContainer">
      @for (mi of menuItems(); track mi) {
        <a
          routerLink="{{ '/' + mi.url }}"
          routerLinkActive="navLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          class="navLink"
          >
          {{ mi.label }}
        </a>
      }
    </div>
    <button type="button" (click)="toggleApps()" class="hamburgerMenu" aria-label="Toggle the app switcher">
      <mat-icon color="accent">apps</mat-icon>
    </button>
  </mat-toolbar-row>
</mat-toolbar>
