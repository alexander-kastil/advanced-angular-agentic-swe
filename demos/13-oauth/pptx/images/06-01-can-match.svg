<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Guarding routes with canMatch</title>
  <desc>Router timeline: URL, match route, load lazy chunk, activate. canMatch sits at match route and returns a UrlTree to /demos/app-auth-flow when signed out, so the lazy chunk never loads. canActivate runs later, when the chunk is already downloading. The guard remembers the attempted URL with rememberReturnUrl.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa1a9"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="100" width="400" height="170" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="260" y="170" text-anchor="middle" font-size="32" fill="#57606a">redirect to</text>
    <text x="260" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">/demos/app-auth-flow</text>

    <rect x="540" y="100" width="400" height="170" rx="20" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
    <text x="740" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">canMatch</text>
    <text x="740" y="225" text-anchor="middle" font-size="30" fill="#57606a">returns a UrlTree</text>

    <rect x="60" y="390" width="400" height="160" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="260" y="484" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">URL</text>
    <rect x="540" y="390" width="400" height="160" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="740" y="484" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">match route</text>
    <rect x="1020" y="390" width="400" height="160" rx="20" fill="#ffffff" stroke="#9aa1a9" stroke-width="2" stroke-dasharray="12 10"/>
    <text x="1220" y="470" text-anchor="middle" font-size="40" font-weight="700" fill="#9aa1a9">load lazy chunk</text>
    <text x="1220" y="518" text-anchor="middle" font-size="28" fill="#9aa1a9">never downloads</text>
    <rect x="1500" y="390" width="380" height="160" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1690" y="484" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">activate</text>

    <line x1="462" y1="470" x2="531" y2="470" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="942" y1="470" x2="1011" y2="470" stroke="#9aa1a9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowGrey)"/>
    <line x1="1422" y1="470" x2="1491" y2="470" stroke="#9aa1a9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowGrey)"/>

    <line x1="740" y1="388" x2="740" y2="272" stroke="#2f8f57" stroke-width="4"/>
    <line x1="538" y1="185" x2="469" y2="185" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>

    <line x1="740" y1="552" x2="740" y2="671" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="540" y="680" width="400" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="740" y="732" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">rememberReturnUrl()</text>
    <text x="740" y="815" text-anchor="middle" font-size="30" fill="#57606a">keeps the attempted URL</text>

    <line x1="1690" y1="680" x2="1690" y2="552" stroke="#e0a534" stroke-width="4"/>
    <rect x="1440" y="680" width="440" height="170" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="1660" y="750" text-anchor="middle" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#24292f">canActivate</text>
    <text x="1660" y="805" text-anchor="middle" font-size="28" fill="#57606a">chunk already downloading</text>
  </g>
</svg>
