<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Auth interceptor with an allowlist</title>
  <desc>HttpClient sends three requests through authInterceptor, which holds the PROTECTED_APIS allowlist with https://api.ng-oauth.demo/ and matches the full origin. api.ng-oauth.demo/orders receives Authorization: Bearer eyJ... The CDN host cdn.thirdparty.demo and the look-alike host api.ng-oauth.demo.attacker.example receive no header.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c24141"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="120" width="300" height="840" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="190" y="520" text-anchor="middle" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#24292f">HttpClient</text>
    <text x="190" y="580" text-anchor="middle" font-size="30" fill="#57606a">3 requests</text>

    <rect x="480" y="120" width="640" height="840" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="800" y="330" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="700" fill="#24292f">authInterceptor</text>
    <text x="800" y="385" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#57606a">HttpInterceptorFn</text>
    <rect x="520" y="450" width="560" height="220" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="800" y="520" text-anchor="middle" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#24292f">PROTECTED_APIS</text>
    <text x="800" y="580" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#24292f">['https://api.ng-oauth.demo/']</text>
    <text x="800" y="635" text-anchor="middle" font-size="28" fill="#57606a">matches the full origin</text>

    <g stroke="#57606a" stroke-width="4">
      <line x1="344" y1="250" x2="470" y2="250" marker-end="url(#arrow)"/>
      <line x1="344" y1="540" x2="470" y2="540" marker-end="url(#arrow)"/>
      <line x1="344" y1="830" x2="470" y2="830" marker-end="url(#arrow)"/>
    </g>
    <line x1="1124" y1="250" x2="1230" y2="250" stroke="#2f8f57" stroke-width="4" marker-end="url(#arrow-green)"/>
    <line x1="1124" y1="540" x2="1230" y2="540" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1124" y1="830" x2="1230" y2="830" stroke="#c24141" stroke-width="4" marker-end="url(#arrow-red)"/>

    <rect x="1240" y="140" width="640" height="220" rx="20" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
    <text x="1270" y="220" font-family="Consolas, monospace" font-size="28" fill="#24292f">api.ng-oauth.demo/orders</text>
    <text x="1270" y="300" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#2f8f57">Bearer eyJ...</text>

    <rect x="1240" y="430" width="640" height="220" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1270" y="510" font-family="Consolas, monospace" font-size="28" fill="#24292f">cdn.thirdparty.demo</text>
    <text x="1270" y="590" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#57606a">(none)</text>

    <rect x="1240" y="720" width="640" height="220" rx="20" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
    <text x="1270" y="800" font-family="Consolas, monospace" font-size="27" fill="#24292f">api.ng-oauth.demo.attacker.example</text>
    <text x="1270" y="880" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#c24141">(none)</text>
    <text x="1430" y="880" font-size="30" fill="#57606a">look-alike host</text>
  </g>
</svg>
