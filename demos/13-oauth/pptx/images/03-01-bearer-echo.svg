<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Bearer header against the echo API</title>
  <desc>Two GET requests to the echo API at https://api.ng-oauth.demo/. Without a header the API answers 401 with WWW-Authenticate: Bearer. With Authorization: Bearer eyJ... it answers 200 and echoes the header. observe: 'response' returns status, headers and body.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c24141"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="60" width="540" height="300" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="170" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#24292f">GET /orders</text>
    <text x="80" y="240" font-size="30" fill="#57606a">no header</text>

    <rect x="40" y="460" width="540" height="300" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="570" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#24292f">GET /orders</text>
    <text x="80" y="640" font-family="Consolas, monospace" font-size="28" fill="#24292f">Authorization:</text>
    <text x="80" y="682" font-family="Consolas, monospace" font-size="28" fill="#24292f">Bearer eyJ...</text>

    <rect x="720" y="60" width="480" height="700" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="380" text-anchor="middle" font-size="42" font-weight="700" fill="#24292f">echo API</text>
    <text x="960" y="440" text-anchor="middle" font-family="Consolas, monospace" font-size="26" fill="#57606a">https://api.ng-oauth.demo/</text>

    <rect x="1340" y="60" width="540" height="300" rx="20" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
    <text x="1380" y="170" font-size="52" font-weight="700" fill="#c24141">401</text>
    <text x="1380" y="240" font-family="Consolas, monospace" font-size="28" fill="#24292f">WWW-Authenticate:</text>
    <text x="1380" y="282" font-family="Consolas, monospace" font-size="28" fill="#24292f">Bearer</text>

    <rect x="1340" y="460" width="540" height="300" rx="20" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
    <text x="1380" y="570" font-size="52" font-weight="700" fill="#2f8f57">200</text>
    <text x="1380" y="640" font-size="30" fill="#57606a">echoes the header</text>
    <text x="1380" y="682" font-family="Consolas, monospace" font-size="28" fill="#24292f">Bearer eyJ...</text>

    <line x1="584" y1="210" x2="710" y2="210" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="584" y1="610" x2="710" y2="610" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1204" y1="210" x2="1330" y2="210" stroke="#c24141" stroke-width="4" marker-end="url(#arrow-red)"/>
    <line x1="1204" y1="610" x2="1330" y2="610" stroke="#2f8f57" stroke-width="4" marker-end="url(#arrow-green)"/>

    <rect x="40" y="840" width="1840" height="180" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="100" y="945" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">observe: 'response'</text>
    <text x="620" y="945" font-size="34" fill="#57606a">returns status, headers and body</text>
  </g>
</svg>
