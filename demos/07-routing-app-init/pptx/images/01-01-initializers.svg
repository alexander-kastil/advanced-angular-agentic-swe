<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Startup work before the first render</title>
  <desc>provideAppInitializer blocks bootstrap until its promises resolve, on the critical path. injectAsync loads RemoteFlagsService from its own lazy chunk; a component can prefetch the same chunk with prefetch onIdle, off the critical path.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="70" font-size="32" font-weight="700" fill="#24292f">Critical path</text>
    <rect x="40" y="100" width="420" height="160" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="250" y="195" font-size="32" fill="#24292f" text-anchor="middle">bootstrap</text>
    <line x1="460" y1="180" x2="542" y2="180" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="550" y="100" width="820" height="160" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="590" y="165" font-size="30" font-weight="700" fill="#24292f" font-family="Consolas, monospace">provideAppInitializer</text>
    <text x="590" y="220" font-size="28" fill="#57606a">waits: config.json into a signal</text>
    <line x1="1370" y1="180" x2="1452" y2="180" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="1460" y="100" width="420" height="160" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1670" y="195" font-size="32" fill="#24292f" text-anchor="middle">first render</text>
    <text x="40" y="370" font-size="32" font-weight="700" fill="#24292f">Lazy service</text>
    <rect x="40" y="400" width="1000" height="240" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="80" y="465" font-size="30" font-weight="700" fill="#24292f" font-family="Consolas, monospace">injectAsync(() =&gt;</text>
    <text x="110" y="515" font-size="28" fill="#24292f" font-family="Consolas, monospace">import('./remote-flags.service'))</text>
    <text x="80" y="590" font-size="28" fill="#57606a">call before the first await</text>
    <line x1="1040" y1="520" x2="1192" y2="520" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="1200" y="430" width="680" height="180" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1540" y="510" font-size="30" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">remote-flags chunk</text>
    <text x="1540" y="560" font-size="28" fill="#57606a" text-anchor="middle">not in the initial bundle</text>
    <text x="40" y="740" font-size="32" font-weight="700" fill="#24292f">Off the critical path</text>
    <rect x="40" y="770" width="1000" height="240" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="835" font-size="30" font-weight="700" fill="#24292f">Component</text>
    <text x="80" y="890" font-size="28" fill="#24292f" font-family="Consolas, monospace">injectAsync(loader,</text>
    <text x="110" y="940" font-size="28" fill="#24292f" font-family="Consolas, monospace">{ prefetch: onIdle })</text>
    <path d="M1040 890 H1540 V618" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
    <text x="1570" y="790" font-size="28" fill="#57606a">fetched when the</text>
    <text x="1570" y="830" font-size="28" fill="#57606a">browser is idle</text>
  </g>
</svg>
