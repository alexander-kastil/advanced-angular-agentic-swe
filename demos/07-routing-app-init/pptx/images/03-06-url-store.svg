<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>A SignalStore driven by the URL</title>
  <desc>The URL route-driven-store/:category?q= binds category and q as inputs, a computed routeFilter folds them, and store.applyRouteFilter, a signalMethod, patches CatalogStore once per navigation. The route provides CatalogStore; the UI writes only through router.navigate.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="60" width="1840" height="120" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="135" font-size="32" fill="#24292f" font-family="Consolas, monospace">/route-driven-store/books?q=angular</text>
    <line x1="300" y1="180" x2="300" y2="262" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="270" width="520" height="200" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="335" font-size="30" font-weight="700" fill="#24292f">inputs</text>
    <text x="80" y="390" font-size="28" fill="#24292f" font-family="Consolas, monospace">category()</text>
    <text x="80" y="435" font-size="28" fill="#24292f" font-family="Consolas, monospace">q()</text>
    <line x1="560" y1="370" x2="642" y2="370" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="650" y="270" width="560" height="200" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="690" y="335" font-size="30" font-weight="700" fill="#24292f" font-family="Consolas, monospace">computed</text>
    <text x="690" y="390" font-size="28" fill="#24292f" font-family="Consolas, monospace">routeFilter()</text>
    <text x="690" y="435" font-size="26" fill="#57606a">one patch per navigation</text>
    <line x1="1210" y1="370" x2="1292" y2="370" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="1300" y="270" width="580" height="200" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1340" y="335" font-size="28" fill="#24292f" font-family="Consolas, monospace">applyRouteFilter</text>
    <text x="1340" y="390" font-size="28" fill="#24292f" font-family="Consolas, monospace">signalMethod</text>
    <text x="1340" y="435" font-size="26" fill="#57606a">bound once in the constructor</text>
    <line x1="1590" y1="470" x2="1590" y2="552" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="1000" y="560" width="880" height="260" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1040" y="625" font-size="30" font-weight="700" fill="#24292f" font-family="Consolas, monospace">CatalogStore</text>
    <text x="1040" y="680" font-size="28" fill="#24292f" font-family="Consolas, monospace">category, q, applied</text>
    <text x="1040" y="730" font-size="28" fill="#24292f" font-family="Consolas, monospace">visible()</text>
    <text x="1040" y="785" font-size="26" fill="#57606a" font-family="Consolas, monospace">providers: [CatalogStore] on the route</text>
    <rect x="40" y="560" width="880" height="260" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="625" font-size="30" font-weight="700" fill="#24292f">UI writes</text>
    <text x="80" y="680" font-size="28" fill="#24292f" font-family="Consolas, monospace">selectCategory(c)</text>
    <text x="80" y="730" font-size="28" fill="#24292f" font-family="Consolas, monospace">router.navigate(...)</text>
    <text x="80" y="785" font-size="26" fill="#57606a">never patchState from the template</text>
    <path d="M100 820 V880 H18 V120 H32" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
    <text x="140" y="890" font-size="28" fill="#57606a">writes go back to the URL: the only writer</text>
  </g>
</svg>
