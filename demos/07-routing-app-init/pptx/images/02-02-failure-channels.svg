<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Two failure channels</title>
  <desc>A throwing guard, resolver or import reaches withNavigationErrorHandler. Returning a RedirectCommand ends in NavigationCancel and a redirect; returning anything else emits NavigationError and rethrows to ErrorHandler. Errors in component methods and lifecycle hooks go straight to ErrorHandler, which records them and routes to /error.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="60" width="440" height="200" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="260" y="140" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">guard, resolver</text>
    <text x="260" y="190" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">or import throws</text>
    <line x1="480" y1="160" x2="572" y2="160" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="580" y="60" width="700" height="200" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="930" y="150" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">withNavigation</text>
    <text x="930" y="195" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">ErrorHandler</text>
    <line x1="1280" y1="130" x2="1372" y2="130" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <text x="1326" y="110" font-size="24" fill="#57606a" text-anchor="middle">A</text>
    <rect x="1380" y="60" width="500" height="200" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="125" font-size="28" fill="#24292f" font-family="Consolas, monospace">RedirectCommand</text>
    <text x="1410" y="180" font-size="26" fill="#57606a">NavigationCancel,</text>
    <text x="1410" y="220" font-size="26" fill="#57606a">redirect, done</text>
    <line x1="930" y1="260" x2="930" y2="372" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <text x="950" y="325" font-size="24" fill="#57606a">B: anything else</text>
    <rect x="580" y="380" width="700" height="160" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="930" y="450" font-size="28" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">NavigationError</text>
    <text x="930" y="500" font-size="26" fill="#57606a" text-anchor="middle">emitted and rethrown</text>
    <line x1="930" y1="540" x2="930" y2="772" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="40" y="800" width="440" height="200" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="260" y="885" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">method or</text>
    <text x="260" y="935" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">hook throws</text>
    <line x1="480" y1="900" x2="572" y2="900" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="580" y="780" width="700" height="240" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="930" y="850" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">ErrorHandler</text>
    <text x="930" y="905" font-size="26" fill="#57606a" text-anchor="middle" font-family="Consolas, monospace">GlobalErrorHandler.handleError</text>
    <text x="930" y="960" font-size="26" fill="#57606a" text-anchor="middle">record, then route to /error</text>
    <rect x="1380" y="380" width="500" height="640" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="450" font-size="30" font-weight="700" fill="#24292f">Wire both</text>
    <text x="1410" y="510" font-size="26" fill="#57606a">or half the failures</text>
    <text x="1410" y="550" font-size="26" fill="#57606a">go unreported</text>
    <text x="1410" y="640" font-size="26" fill="#24292f" font-family="Consolas, monospace">router.events</text>
    <text x="1410" y="680" font-size="26" fill="#57606a">still works to observe</text>
    <text x="1410" y="720" font-size="26" fill="#57606a">from several places</text>
  </g>
</svg>
