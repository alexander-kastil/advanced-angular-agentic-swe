<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Route state as signal inputs</title>
  <desc>Path parameter tenant, query parameter q, static data release and resolved album flow into input signals of the routed component through withComponentInputBinding. An absent key is written as undefined, so inputs use a transform. Writes go back through router.navigate with queryParamsHandling merge.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f">
      <rect x="40" y="60" width="520" height="120" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
      <text x="70" y="115">:tenant</text>
      <text x="70" y="158" font-size="24" fill="#57606a">path parameter</text>
      <rect x="40" y="220" width="520" height="120" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
      <text x="70" y="275">?q=angular</text>
      <text x="70" y="318" font-size="24" fill="#57606a">query parameter</text>
      <rect x="40" y="380" width="520" height="120" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
      <text x="70" y="435">data: { release }</text>
      <text x="70" y="478" font-size="24" fill="#57606a">static route data</text>
      <rect x="40" y="540" width="520" height="120" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
      <text x="70" y="595">resolve: { album }</text>
      <text x="70" y="638" font-size="24" fill="#57606a">resolved value</text>
    </g>
    <g stroke="#57606a" stroke-width="3">
      <line x1="560" y1="120" x2="1052" y2="300" marker-end="url(#a)"/>
      <line x1="560" y1="280" x2="1052" y2="340" marker-end="url(#a)"/>
      <line x1="560" y1="440" x2="1052" y2="380" marker-end="url(#a)"/>
      <line x1="560" y1="600" x2="1052" y2="420" marker-end="url(#a)"/>
    </g>
    <rect x="1060" y="60" width="820" height="600" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1100" y="130" font-size="32" font-weight="700" fill="#24292f">Routed component</text>
    <g font-family="Consolas, monospace" font-size="30" fill="#24292f">
      <text x="1100" y="250">tenant = input.required()</text>
      <text x="1100" y="320">q = input('', { transform })</text>
      <text x="1100" y="390">release = input('')</text>
      <text x="1100" y="460">album = input.required()</text>
    </g>
    <text x="1100" y="560" font-size="28" fill="#57606a">no ActivatedRoute, no subscription</text>
    <rect x="40" y="720" width="900" height="300" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="80" y="790" font-size="30" font-weight="700" fill="#24292f">Absent key writes undefined</text>
    <text x="80" y="850" font-size="26" fill="#24292f" font-family="Consolas, monospace">unmatchedInputBehavior:</text>
    <text x="80" y="895" font-size="26" fill="#24292f" font-family="Consolas, monospace">  'alwaysUndefined'</text>
    <text x="80" y="965" font-size="26" fill="#57606a">absorb it with a transform</text>
    <rect x="980" y="720" width="900" height="300" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1020" y="790" font-size="30" font-weight="700" fill="#24292f">The URL is the state</text>
    <text x="1020" y="850" font-size="26" fill="#24292f" font-family="Consolas, monospace">router.navigate([], {</text>
    <text x="1020" y="895" font-size="26" fill="#24292f" font-family="Consolas, monospace">  queryParamsHandling: 'merge' })</text>
    <text x="1020" y="965" font-size="26" fill="#57606a">back, forward, reload and links work</text>
  </g>
</svg>
