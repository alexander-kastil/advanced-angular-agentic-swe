<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>One app.config.ts wires it all</title>
  <desc>app.config.ts registers initializers, three functional interceptors in order, five router features and a GlobalErrorHandler class.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="70" font-size="40" font-weight="700" fill="#24292f" font-family="Consolas, monospace">app.config.ts</text>
    <rect x="40" y="110" width="880" height="300" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="175" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">provideAppInitializer</text>
    <text x="80" y="240" font-size="28" fill="#24292f" font-family="Consolas, monospace">ConfigService.loadConfig()</text>
    <text x="80" y="290" font-size="28" fill="#24292f" font-family="Consolas, monospace">AppInitService.loadData()</text>
    <text x="80" y="360" font-size="28" fill="#57606a">before the first render</text>
    <rect x="1000" y="110" width="880" height="300" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1040" y="175" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">provideHttpClient</text>
    <text x="1040" y="240" font-size="28" fill="#24292f" font-family="Consolas, monospace">1 authInterceptor</text>
    <text x="1040" y="290" font-size="28" fill="#24292f" font-family="Consolas, monospace">2 retryInterceptor</text>
    <text x="1040" y="340" font-size="28" fill="#24292f" font-family="Consolas, monospace">3 httpErrorInterceptor</text>
    <rect x="40" y="460" width="1840" height="400" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="80" y="525" font-size="32" font-weight="700" fill="#24292f" font-family="Consolas, monospace">provideRouter(appRoutes, ...)</text>
    <g font-family="Consolas, monospace" font-size="28" fill="#24292f">
      <rect x="80" y="565" width="860" height="80" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
      <text x="110" y="617">withComponentInputBinding</text>
      <rect x="980" y="565" width="860" height="80" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="617">withViewTransitions</text>
      <rect x="80" y="665" width="860" height="80" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
      <text x="110" y="717">withPreloading(Selective...)</text>
      <rect x="980" y="665" width="860" height="80" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
      <text x="1010" y="717">withExperimentalAutoCleanupInjectors</text>
      <rect x="80" y="765" width="1760" height="80" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
      <text x="110" y="817">withNavigationErrorHandler(... RedirectCommand)</text>
    </g>
    <rect x="40" y="910" width="1840" height="130" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="80" y="990" font-size="30" fill="#24292f" font-family="Consolas, monospace">{ provide: ErrorHandler, useExisting: GlobalErrorHandler }</text>
  </g>
</svg>
