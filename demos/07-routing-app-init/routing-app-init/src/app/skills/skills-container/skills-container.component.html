<div class="page">
  <div class="app-toolbar justify-between">
    <div class="text-sm font-semibold tracking-tight text-ink">SPA Skills</div>
    <div class="flex items-center gap-4">
      <app-slide-toggle [checked]="showAll()" (toggled)="showAll.set($event)">ShowAll</app-slide-toggle>
      <button type="button" class="btn btn-primary" (click)="addItem()">Add</button>
    </div>
  </div>

  <div class="overflow-hidden rounded-lg border border-line bg-white shadow-sm">
    @for (sk of skills(); track sk.id) {
      <app-skill-row [skill]="sk" (itemDeleted)="deleteItem($event)" (itemCompleted)="toggleItemComplete($event)" />
    } @empty {
      <p class="px-4 py-3 text-sm text-slate-500">No skills loaded. Start json-server using: json-server db.json</p>
    }
  </div>

  <app-skills-kpi />
</div>
