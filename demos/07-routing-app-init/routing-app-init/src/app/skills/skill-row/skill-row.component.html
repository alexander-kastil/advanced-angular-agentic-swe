<div class="skillrow">
  <div class="name">{{ skill().name }}</div>
  <div class="completed">
    <span class="icon" [class.text-primary]="skill().completed" [class.text-slate-300]="!skill().completed">
      {{ skill().completed ? 'check_circle' : 'radio_button_unchecked' }}
    </span>
  </div>
  <div class="cmd">
    <button
      type="button"
      class="btn-icon tip tip-left"
      data-tip="Toggle completed"
      [attr.aria-label]="'Toggle completed: ' + skill().name"
      (click)="itemCompleted.emit(skill())">
      <span class="icon">done</span>
    </button>
    <button
      type="button"
      class="btn-icon tip tip-left"
      data-tip="Edit"
      [attr.aria-label]="'Edit skill: ' + skill().name"
      [routerLink]="['/skills', skill().id]">
      <span class="icon">edit</span>
    </button>
    <button
      type="button"
      class="btn-icon tip tip-left hover:bg-warn/10 hover:text-warn"
      data-tip="Delete"
      [attr.aria-label]="'Delete skill: ' + skill().name"
      (click)="itemDeleted.emit(skill())">
      <span class="icon">delete</span>
    </button>
  </div>
</div>
