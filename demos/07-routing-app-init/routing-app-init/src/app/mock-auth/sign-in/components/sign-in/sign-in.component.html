<dialog #dialog class="modal" aria-labelledby="sign-in-title" (close)="onClosed()">
  <div class="card mb-0">
    <div class="card-header">
      <h2 id="sign-in-title" class="card-title">Please sign-in to continue</h2>
    </div>

    <div class="card-content gap-4">
      <div class="field">
        <label class="label" for="sign-in-email">Email</label>
        <input id="sign-in-email" class="input" type="email" placeholder="Email" autocomplete="email" />
      </div>

      <div class="field">
        <label class="label" for="sign-in-password">Password</label>
        <input id="sign-in-password" class="input" type="password" placeholder="Password" autocomplete="current-password" />
      </div>
    </div>

    <div class="card-actions actions">
      <button type="button" class="btn btn-primary" (click)="signIn()">Sign In</button>
      <button type="button" class="btn btn-primary" [routerLink]="['../sign-up']">Register</button>
    </div>
  </div>
</dialog>
