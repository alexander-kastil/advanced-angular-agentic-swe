<app-markdown-renderer [md]="'interceptor'" />
<div class="card">
  <div class="card-header">
    <h2 class="card-title">Interceptors</h2>
  </div>
  <div class="card-content">
    <p><strong>URL:</strong> {{ requestUrl() }}</p>
    @if (data.isLoading()) {
      <p>Loading...</p>
    } @else if (data.error()) {
      <p class="text-[#b91c1c]">Error: {{ data.error() | json }}</p>
    } @else if (data.value()) {
      <pre tabindex="0" role="region" aria-label="Response payload">{{ data.value() | json }}</pre>
    }
  </div>
  <div class="card-actions">
    <button type="button" class="btn btn-primary" (click)="requestData()">JSON Request</button>
    <button type="button" class="btn btn-outline" (click)="requestXMLData()">XML Request</button>
    <button type="button" class="btn btn-warn" (click)="request404Data()">404 Request</button>
  </div>
</div>
