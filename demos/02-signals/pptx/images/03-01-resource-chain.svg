<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Chaining dependent resources</title>
  <desc>skills, selected and a third resource chained with chain(); statuses propagate.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="140" width="520" height="260" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="320.0" y="242.0" text-anchor="middle" font-size="40" font-family="Consolas, monospace" font-weight="700" fill="#24292f">skills</text>
    <text x="320.0" y="286.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">httpResource</text>
    <text x="320.0" y="326.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">skills</text>
    <path d="M580,270 L698,270" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="700" y="140" width="520" height="260" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="960.0" y="242.0" text-anchor="middle" font-size="40" font-family="Consolas, monospace" font-weight="700" fill="#24292f">selected</text>
    <text x="960.0" y="286.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">chain(skills)</text>
    <text x="960.0" y="326.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">skills/:id</text>
    <path d="M1220,270 L1338,270" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1340" y="140" width="520" height="260" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1600.0" y="242.0" text-anchor="middle" font-size="40" font-family="Consolas, monospace" font-weight="700" fill="#24292f">detail</text>
    <text x="1600.0" y="286.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">chain(selected)</text>
    <text x="1600.0" y="326.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">...</text>
    <text x="960" y="470" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#57606a">({ chain }) =&gt; ... from the params context</text>
    <text x="330" y="560" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">dependency</text>
    <text x="960" y="560" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">chain() does</text>
    <text x="1590" y="560" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">chained resource</text>
    <rect x="80" y="590" width="500" height="80" rx="40.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="330.0" y="639.8" text-anchor="middle" font-size="28" fill="#24292f">resolved / local</text>
    <rect x="710" y="590" width="500" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960.0" y="639.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">returns the value</text>
    <rect x="1340" y="590" width="500" height="80" rx="40.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1590.0" y="639.8" text-anchor="middle" font-size="28" fill="#24292f">request is built</text>
    <rect x="80" y="695" width="500" height="80" rx="40.0" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="330.0" y="744.8" text-anchor="middle" font-size="28" fill="#24292f">loading</text>
    <rect x="710" y="695" width="500" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960.0" y="744.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">throws LOADING</text>
    <rect x="1340" y="695" width="500" height="80" rx="40.0" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1590.0" y="744.8" text-anchor="middle" font-size="28" fill="#24292f">loading</text>
    <rect x="80" y="800" width="500" height="80" rx="40.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="330.0" y="849.8" text-anchor="middle" font-size="28" fill="#24292f">idle</text>
    <rect x="710" y="800" width="500" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960.0" y="849.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">throws IDLE</text>
    <rect x="1340" y="800" width="500" height="80" rx="40.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1590.0" y="849.8" text-anchor="middle" font-size="28" fill="#24292f">idle</text>
    <rect x="80" y="905" width="500" height="80" rx="40.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="330.0" y="954.8" text-anchor="middle" font-size="28" fill="#24292f">error</text>
    <rect x="710" y="905" width="500" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960.0" y="954.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">ResourceDependencyError</text>
    <rect x="1340" y="905" width="500" height="80" rx="40.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1590.0" y="954.8" text-anchor="middle" font-size="28" fill="#24292f">error + dependency</text>
  </g>
</svg>
