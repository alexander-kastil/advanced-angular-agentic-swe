<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Four layers of the signals API</title>
  <desc>Fundamentals, Patterns, Async and Tooling columns with the APIs each covers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="110" width="420" height="860" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="270" y="185" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">Fundamentals</text>
    <rect x="100" y="240" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="289.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">signal()</text>
    <rect x="100" y="355" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="404.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">computed()</text>
    <rect x="100" y="470" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="519.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">effect()</text>
    <rect x="100" y="585" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="634.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">httpResource()</text>
    <rect x="100" y="700" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="749.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">input()</text>
    <rect x="100" y="815" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="864.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">equal</text>
    <path d="M482,540 L518,540" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="520" y="110" width="420" height="860" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="730" y="185" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">Patterns</text>
    <rect x="560" y="240" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="730.0" y="289.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">linkedSignal()</text>
    <rect x="560" y="355" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="730.0" y="404.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">onCleanup</text>
    <rect x="560" y="470" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="730.0" y="519.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">model()</text>
    <rect x="560" y="585" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="730.0" y="634.8" text-anchor="middle" font-size="28" fill="#24292f">container-presenter</text>
    <rect x="560" y="700" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="730.0" y="749.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">toSignal()</text>
    <rect x="560" y="815" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="730.0" y="864.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">rxResource()</text>
    <path d="M942,540 L978,540" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="980" y="110" width="420" height="860" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1190" y="185" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">Async</text>
    <rect x="1020" y="240" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1190.0" y="289.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">chain()</text>
    <rect x="1020" y="355" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1190.0" y="404.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">debounced()</text>
    <rect x="1020" y="470" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1190.0" y="519.8" text-anchor="middle" font-size="28" fill="#24292f">status propagation</text>
    <rect x="1020" y="585" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1190.0" y="634.8" text-anchor="middle" font-size="28" fill="#24292f">typing indicator</text>
    <path d="M1402,540 L1438,540" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1440" y="110" width="420" height="860" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1650" y="185" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">Tooling</text>
    <rect x="1480" y="240" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1650.0" y="289.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">@Service()</text>
    <rect x="1480" y="355" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1650.0" y="404.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">injectAsync()</text>
    <rect x="1480" y="470" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1650.0" y="519.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">debugName</text>
    <rect x="1480" y="585" width="340" height="80" rx="40.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1650.0" y="634.8" text-anchor="middle" font-size="28" fill="#24292f">DevTools graph</text>
  </g>
</svg>
