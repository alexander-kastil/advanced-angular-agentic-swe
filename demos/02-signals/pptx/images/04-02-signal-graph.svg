<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Reading the signal graph</title>
  <desc>ticks, weight, running feed score, band, threshold, skillsByBand and headline; tickerEffect writes back into ticks.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="100" width="300" height="130" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="230.0" y="155.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">ticks</text>
    <text x="230.0" y="196.5" text-anchor="middle" font-size="26" fill="#57606a">signal</text>
    <rect x="440" y="100" width="300" height="130" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="590.0" y="155.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">weight</text>
    <text x="590.0" y="196.5" text-anchor="middle" font-size="26" fill="#57606a">signal</text>
    <rect x="1500" y="100" width="300" height="130" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1650.0" y="155.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">running</text>
    <text x="1650.0" y="196.5" text-anchor="middle" font-size="26" fill="#57606a">signal</text>
    <rect x="260" y="330" width="300" height="130" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="410.0" y="385.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">score</text>
    <text x="410.0" y="426.5" text-anchor="middle" font-size="26" fill="#57606a">computed</text>
    <rect x="260" y="540" width="300" height="130" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="410.0" y="595.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">band</text>
    <text x="410.0" y="636.5" text-anchor="middle" font-size="26" fill="#57606a">computed</text>
    <rect x="60" y="760" width="300" height="130" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="210.0" y="815.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">threshold</text>
    <text x="210.0" y="856.5" text-anchor="middle" font-size="26" fill="#57606a">linkedSignal</text>
    <rect x="480" y="760" width="300" height="130" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="630.0" y="815.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">skillsByBand</text>
    <text x="630.0" y="856.5" text-anchor="middle" font-size="26" fill="#57606a">httpResource</text>
    <rect x="900" y="860" width="300" height="130" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1050.0" y="915.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">headline</text>
    <text x="1050.0" y="956.5" text-anchor="middle" font-size="26" fill="#57606a">computed</text>
    <rect x="1500" y="540" width="300" height="130" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1650.0" y="595.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" font-weight="700" fill="#24292f">tickerEffect</text>
    <text x="1650.0" y="636.5" text-anchor="middle" font-size="26" fill="#57606a">effect</text>
    <path d="M230,222 L360,328" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M590,222 L460,328" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M410,452 L410,538" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M330,662 L230,758" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M490,662 L610,758" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M210,882 L210,920 L898,920" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M630,882 L630,905 L898,905" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M560,600 L1040,600 L1040,858" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1650,222 L1650,538" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1500,600 L1300,600 L1300,60 L230,60 L230,98" fill="none" stroke="#c24141" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-red)"/>
    <text x="1310" y="660" text-anchor="start" font-size="26" fill="#c24141">writes ticks</text>
    <rect x="1300" y="760" width="560" height="260" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1580" y="815" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">reading it</text>
    <text x="1330" y="870" text-anchor="start" font-size="26" fill="#57606a">no incoming edge: signal</text>
    <text x="1330" y="920" text-anchor="start" font-size="26" fill="#57606a">highlighted: recomputed</text>
    <text x="1330" y="970" text-anchor="start" font-size="26" fill="#57606a">dark: equal, skipped</text>
  </g>
</svg>
