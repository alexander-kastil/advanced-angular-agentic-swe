<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Writable derived state with linkedSignal</title>
  <desc>stock source feeds computation, which derives quantity; writes go through a set gate that clamps before rawSet.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="160" width="420" height="240" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="270.5" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">source</text>
    <text x="270.0" y="317.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#57606a">stock = signal(10)</text>
    <rect x="600" y="160" width="600" height="240" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="900.0" y="252.0" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">computation</text>
    <text x="900.0" y="296.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">(stock, previous) =&gt;</text>
    <text x="900.0" y="336.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">min(previous ?? 1, stock)</text>
    <rect x="1320" y="160" width="540" height="240" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1590.0" y="272.0" text-anchor="middle" font-size="40" font-family="Consolas, monospace" font-weight="700" fill="#24292f">quantity</text>
    <text x="1590.0" y="316.0" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">linkedSignal&lt;number, number&gt;</text>
    <path d="M480,280 L598,280" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1200,280 L1318,280" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="600" width="420" height="240" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="689.0" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">caller</text>
    <text x="270.0" y="736.0" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#57606a">.set(7)</text>
    <text x="270.0" y="779.0" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#57606a">.update(q =&gt; q + 1)</text>
    <rect x="600" y="560" width="600" height="320" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="900.0" y="650.8" text-anchor="middle" font-size="36" font-family="Consolas, monospace" font-weight="700" fill="#24292f">set(value, rawSet)</text>
    <text x="900.0" y="694.8" text-anchor="middle" font-size="28" fill="#57606a">clamp 1..stock (untracked)</text>
    <text x="900.0" y="734.8" text-anchor="middle" font-size="28" fill="#57606a">log lastWrite</text>
    <text x="900.0" y="774.8" text-anchor="middle" font-size="28" fill="#57606a">rawSet(clamped)</text>
    <text x="900.0" y="814.8" text-anchor="middle" font-size="28" fill="#57606a">no rawSet: write dropped</text>
    <path d="M480,720 L598,720" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1200,720 L1590,720 L1590,402" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1260" y="470" width="600" height="64" rx="32.0" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1560.0" y="511.8" text-anchor="middle" font-size="28" fill="#24292f">source changes: recompute</text>
    <rect x="1260" y="800" width="600" height="64" rx="32.0" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1560.0" y="841.8" text-anchor="middle" font-size="28" fill="#24292f">someone writes: set decides</text>
    <text x="960" y="1000" text-anchor="middle" font-size="30" fill="#57606a">computed is read-only; linkedSignal re-derives and accepts writes</text>
  </g>
</svg>
