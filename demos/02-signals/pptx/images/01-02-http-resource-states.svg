<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Loading data with httpResource</title>
  <desc>A filter signal feeds the request function of httpResource, which exposes value, isLoading, error and status; undefined keeps it idle.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="330" width="460" height="220" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="270.0" y="413.2" text-anchor="middle" font-size="34" font-family="Consolas, monospace" font-weight="700" fill="#24292f">completedFilter</text>
    <text x="270.0" y="454.2" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">signal&lt;boolean |</text>
    <text x="270.0" y="491.2" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">undefined&gt;</text>
    <rect x="560" y="280" width="520" height="320" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="820.0" y="394.7" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">request function</text>
    <text x="820.0" y="435.7" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">() =&gt; filter !== undefined</text>
    <text x="820.0" y="472.7" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">? `skills?completed=${f}`</text>
    <text x="820.0" y="509.7" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">: undefined</text>
    <rect x="1200" y="200" width="660" height="480" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1530" y="270" text-anchor="middle" font-size="38" font-family="Consolas, monospace" font-weight="700" fill="#24292f">httpResource&lt;Skill[]&gt;</text>
    <rect x="1300" y="310" width="460" height="58" rx="29.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1530.0" y="348.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">value()</text>
    <rect x="1300" y="382" width="460" height="58" rx="29.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1530.0" y="420.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">isLoading()</text>
    <rect x="1300" y="454" width="460" height="58" rx="29.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1530.0" y="492.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">error()</text>
    <rect x="1300" y="526" width="460" height="58" rx="29.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1530.0" y="564.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">status()</text>
    <rect x="1300" y="598" width="460" height="58" rx="29.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1530.0" y="636.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">update(fn)</text>
    <path d="M500,440 L558,440" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1080,440 L1198,440" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1530,680 L1530,760 L250,760 L250,552" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="890" y="740" text-anchor="middle" font-size="28" fill="#57606a">filter.set(true): new URL, refetch</text>
    <rect x="120" y="830" width="380" height="170" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="310.0" y="906.7" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Idle</text>
    <text x="310.0" y="947.7" text-anchor="middle" font-size="26" fill="#57606a">returned undefined</text>
    <rect x="560" y="830" width="380" height="170" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="750.0" y="906.7" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Loading</text>
    <text x="750.0" y="947.7" text-anchor="middle" font-size="26" fill="#57606a">in flight</text>
    <rect x="1000" y="830" width="380" height="170" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="1190.0" y="906.7" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Resolved</text>
    <text x="1190.0" y="947.7" text-anchor="middle" font-size="26" fill="#57606a">value()</text>
    <rect x="1440" y="830" width="380" height="170" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="1630.0" y="906.7" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Error</text>
    <text x="1630.0" y="947.7" text-anchor="middle" font-size="26" fill="#57606a">error()</text>
  </g>
</svg>
