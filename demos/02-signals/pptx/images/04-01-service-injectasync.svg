<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>@Service and injectAsync</title>
  <desc>Before and after decorators, and a lazy service chunk loaded with injectAsync and onIdle prefetch.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="470" y="150" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">migration</text>
    <rect x="60" y="190" width="820" height="80" rx="40.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="470.0" y="239.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">@Injectable({ providedIn: 'root' })</text>
    <rect x="60" y="330" width="820" height="80" rx="40.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="470.0" y="380.5" text-anchor="middle" font-size="30" font-family="Consolas, monospace" fill="#24292f">@Service()</text>
    <path d="M470,272 L470,328" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="480" width="820" height="80" rx="40.0" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
    <text x="470.0" y="529.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">@Injectable()</text>
    <rect x="60" y="620" width="820" height="80" rx="40.0" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="470.0" y="669.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">@Service({ autoProvided: false })</text>
    <path d="M470,562 L470,618" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="470" y="790" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">ng generate @angular/core:service-migration</text>
    <rect x="1040" y="160" width="820" height="200" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1450.0" y="250.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">initial bundle</text>
    <text x="1450.0" y="294.8" text-anchor="middle" font-size="28" fill="#57606a">component with injectAsync(...)</text>
    <rect x="1040" y="640" width="820" height="200" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1450.0" y="730.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">lazy chunk</text>
    <text x="1450.0" y="774.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">skill-stats.service</text>
    <path d="M1450,362 L1450,638" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="1480" y="470" text-anchor="start" font-size="28" font-family="Consolas, monospace" fill="#24292f">prefetch: onIdle</text>
    <text x="1480" y="530" text-anchor="start" font-size="28" fill="#57606a">await this.stats() on click</text>
    <text x="1450" y="940" text-anchor="middle" font-size="28" fill="#57606a">the service must be auto-provided</text>
  </g>
</svg>
