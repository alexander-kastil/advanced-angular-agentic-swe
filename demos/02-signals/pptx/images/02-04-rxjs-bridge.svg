<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Bridging RxJS and signals</title>
  <desc>toSignal from RxJS to signals, toObservable from signals to RxJS, rxResource spanning both.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="120" width="640" height="560" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="380" y="190" text-anchor="middle" font-size="42" font-weight="700" fill="#24292f">RxJS</text>
    <rect x="140" y="240" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="380.0" y="285.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">Observable</text>
    <rect x="140" y="340" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="380.0" y="385.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">debounceTime()</text>
    <rect x="140" y="440" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="380.0" y="485.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">switchMap()</text>
    <rect x="140" y="540" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="380.0" y="585.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">combineLatest()</text>
    <rect x="1220" y="120" width="640" height="560" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1540" y="190" text-anchor="middle" font-size="42" font-weight="700" fill="#24292f">Signals</text>
    <rect x="1300" y="240" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1540.0" y="285.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">signal()</text>
    <rect x="1300" y="340" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1540.0" y="385.8" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">computed()</text>
    <rect x="1300" y="440" width="480" height="72" rx="36.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1540.0" y="485.8" text-anchor="middle" font-size="28" fill="#24292f">template reads</text>
    <path d="M702,280 L1218,280" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="960" y="250" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">toSignal(obs$, { initialValue })</text>
    <text x="960" y="320" text-anchor="middle" font-size="26" fill="#57606a">read-only signal</text>
    <path d="M1218,520 L702,520" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="960" y="490" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">toObservable(sig)</text>
    <text x="960" y="560" text-anchor="middle" font-size="26" fill="#57606a">entry to operators</text>
    <rect x="260" y="770" width="1400" height="230" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="960" y="840" text-anchor="middle" font-size="36" font-family="Consolas, monospace" font-weight="700" fill="#24292f">rxResource({ params, stream })</text>
    <text x="960" y="900" text-anchor="middle" font-size="28" fill="#57606a">params from signals, stream returns an Observable</text>
    <text x="960" y="955" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">value()  isLoading()  error()  reload()</text>
  </g>
</svg>
