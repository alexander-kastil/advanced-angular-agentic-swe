<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>model and the container-presenter split</title>
  <desc>Container owns httpResource and selection; presenters get inputs and emit outputs; model provides two-way binding.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="120" width="1120" height="330" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="620" y="190" text-anchor="middle" font-size="40" font-weight="700" fill="#24292f">Container</text>
    <rect x="120" y="230" width="1000" height="70" rx="35.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="620.0" y="274.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">personsResource = httpResource&lt;Person[]&gt;(...)</text>
    <rect x="120" y="320" width="1000" height="70" rx="35.0" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="620.0" y="364.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">current = signal&lt;Person | undefined&gt;()</text>
    <rect x="60" y="640" width="520" height="260" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="320.0" y="740.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">List presenter</text>
    <text x="320.0" y="784.8" text-anchor="middle" font-size="28" fill="#57606a">input: persons</text>
    <text x="320.0" y="824.8" text-anchor="middle" font-size="28" fill="#57606a">output: selected</text>
    <rect x="660" y="640" width="520" height="260" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
    <text x="920.0" y="740.8" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Edit presenter</text>
    <text x="920.0" y="784.8" text-anchor="middle" font-size="28" fill="#57606a">input: current</text>
    <text x="920.0" y="824.8" text-anchor="middle" font-size="28" fill="#57606a">output: saved</text>
    <path d="M250,452 L250,638" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M390,638 L390,452" fill="none" stroke="#2f8f57" stroke-width="3" marker-end="url(#arrow-green)"/>
    <path d="M850,452 L850,638" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M990,638 L990,452" fill="none" stroke="#2f8f57" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="240" y="560" text-anchor="end" font-size="26" fill="#57606a">inputs</text>
    <text x="410" y="560" text-anchor="start" font-size="26" fill="#2f8f57">outputs</text>
    <text x="620" y="990" text-anchor="middle" font-size="28" fill="#57606a">saved: personsResource.update(...), no second request</text>
    <rect x="1300" y="120" width="560" height="780" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1580" y="190" text-anchor="middle" font-size="40" font-family="Consolas, monospace" font-weight="700" fill="#24292f">model()</text>
    <rect x="1360" y="250" width="440" height="200" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1580.0" y="341.1" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">parent</text>
    <text x="1580.0" y="382.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">[(expanded)]="state"</text>
    <rect x="1360" y="620" width="440" height="200" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1580.0" y="711.1" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">child</text>
    <text x="1580.0" y="752.1" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#57606a">expanded = model(false)</text>
    <path d="M1580,452 L1580,618" fill="none" stroke="#57606a" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="1600" y="545" text-anchor="start" font-size="26" fill="#57606a">two-way</text>
  </g>
</svg>
