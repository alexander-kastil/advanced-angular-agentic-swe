<div class="card">
  <div class="card-header">
    <h2 class="card-title">Person List</h2>
  </div>
  <div class="card-content">
    <table class="data-table">
      <colgroup>
        <col style="width: 60%" />
        <col style="width: 15%" />
        <col style="width: 15%" />
        <col style="width: 10%" />
      </colgroup>
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Gender</th>
          <th scope="col">Age</th>
          <th scope="col"><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody>
        @for (p of persons(); track p) {
          <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.gender }}</td>
            <td>{{ p.age }}</td>
            <td class="text-right">
              <button type="button" class="btn btn-outline" (click)="selectPerson(p)">Select</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
