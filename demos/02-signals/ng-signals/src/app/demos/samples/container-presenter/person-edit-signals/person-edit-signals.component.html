<div class="card">
  <div class="card-header">
    <h2 class="card-title">Edit</h2>
  </div>
  <div class="card-content">
    <form class="flex flex-col gap-3" [formGroup]="personForm" (ngSubmit)="savePerson()">
      <div class="field">
        <label class="label" for="person-id">Id</label>
        <input id="person-id" class="input" type="text" placeholder="Id" formControlName="id" />
      </div>
      <div class="field">
        <label class="label" for="person-name">Name</label>
        <input id="person-name" class="input" type="text" placeholder="Enter name" formControlName="name" />
      </div>
      <div class="field">
        <label class="label" for="person-age">Age</label>
        <input id="person-age" class="input" type="number" placeholder="Enter age" formControlName="age" />
      </div>
      <fieldset class="field">
        <legend class="label">Gender</legend>
        <div class="flex items-center gap-4">
          <label class="checkbox">
            <input type="radio" value="male" formControlName="gender" />
            Male
          </label>
          <label class="checkbox">
            <input type="radio" value="female" formControlName="gender" />
            Female
          </label>
        </div>
      </fieldset>
    </form>
  </div>
  <div class="card-actions justify-end">
    <button type="button" class="btn btn-primary" (click)="savePerson()">Save</button>
  </div>
</div>
