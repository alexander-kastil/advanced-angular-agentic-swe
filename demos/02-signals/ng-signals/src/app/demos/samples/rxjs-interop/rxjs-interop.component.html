<div border centered>
  <div>toSignal over interval: {{ seconds() }}s</div>
  <div>toObservable of the filter signal: {{ lastFilter() }}</div>
</div>

<button type="button" class="btn btn-primary" (click)="toggleFilter()">
  Toggle filter
</button>

<div border>
  @if (skills.isLoading()) {
    <p>Loading...</p>
  } @else if (skills.error()) {
    <p>Error loading skills</p>
  } @else {
    @for (skill of skills.value(); track skill.id) {
      <div [style.text-decoration]="skill.completed ? 'line-through' : 'none'">
        {{ skill.name }}
      </div>
    } @empty {
      <div>No skills</div>
    }
  }
</div>
