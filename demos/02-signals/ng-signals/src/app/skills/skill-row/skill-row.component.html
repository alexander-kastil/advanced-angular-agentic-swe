<div class="skillrow">
  <div class="name">{{ skill().name }}</div>
  <div class="completed">completed: {{ skill().completed }}</div>
  <div class="cmd">
    <button
      type="button"
      class="btn btn-primary"
      aria-label="Edit skill"
      [routerLink]="['/skills', skill().id]">
      @if (editEnabled()) {<span class="icon">edit</span>}
    </button>
  </div>
</div>
