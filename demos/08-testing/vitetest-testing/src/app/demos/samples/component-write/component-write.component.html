<div class="card">
  <div class="card-header">
    <h2 class="card-title">Write to the DOM</h2>
  </div>
  <div class="card-content">
    <div class="field">
      <label class="label" for="username">Enter your text:</label>
      <input
        id="username"
        data-testid="username"
        class="input"
        type="text"
        [(ngModel)]="user().username"
      />
    </div>
    <div class="output">{{ user().username }}</div>
  </div>
</div>

<app-counter />
