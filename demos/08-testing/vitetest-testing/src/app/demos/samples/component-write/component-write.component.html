<mat-card>
  <mat-card-header>
    <mat-card-title>Write to the DOM</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field>
      <mat-label>Enter your text:</mat-label>
      <input
        data-testid="username"
        matInput
        type="text"
        [(ngModel)]="user().username"
      />
    </mat-form-field>
    <div>{{ user().username }}</div>
  </mat-card-content>
</mat-card>

<app-counter />
