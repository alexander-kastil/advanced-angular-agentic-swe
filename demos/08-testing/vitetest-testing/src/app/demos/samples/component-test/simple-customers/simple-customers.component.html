<div class="card">
  <div class="card-header">
    <h2 class="card-title">Customers</h2>
  </div>
  <div class="card-content">
    @if (customers.isLoading()) {
      <p>Loading...</p>
    } @else {
      @for (c of customers.value() ?? []; track c.id) {
        <div class="customerrow">
          <span>{{ c.id }} - {{ c.name }}</span>
          <button
            type="button"
            class="btn-icon hover:bg-warn/10 hover:text-warn"
            [attr.aria-label]="'Delete ' + c.name"
            (click)="deleteCustomer(c)">
            <span class="icon">close</span>
          </button>
        </div>
      }
    }
  </div>
</div>
