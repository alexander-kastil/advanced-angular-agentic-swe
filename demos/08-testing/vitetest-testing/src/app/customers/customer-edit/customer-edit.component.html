<div class="edit-form">
  <form (submit)="submit($event)">
    <div class="field">
      <label class="label" for="customer-id">Id</label>
      <input id="customer-id" class="input" [value]="customerModel().id" readonly />
    </div>
    <div class="field">
      <label class="label" for="customer-name">Name</label>
      <input
        id="customer-name"
        class="input"
        type="text"
        [attr.aria-invalid]="customerForm.name().touched() && customerForm.name().invalid() ? 'true' : null"
        [attr.aria-describedby]="customerForm.name().touched() && customerForm.name().invalid() ? 'customer-name-error' : null"
        [formField]="customerForm.name"
      />
      @if (customerForm.name().touched() && customerForm.name().invalid()) {
        <div id="customer-name-error" class="text-xs text-warn" role="alert">
          {{ customerForm.name().errors()[0].message }}
        </div>
      }
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit" [disabled]="customerForm().invalid()">Save</button>
      <button class="btn btn-outline" type="button" (click)="cancel.emit()">Cancel</button>
    </div>
  </form>
</div>
