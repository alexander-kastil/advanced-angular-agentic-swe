<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Testing HTTP with HttpTestingController</title>
<desc>Service or httpResource component sends through HttpClient to the testing controller, which asserts and flushes.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="60" y="100" width="520" height="340" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="320.0" y="211.95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">Under test</text>
<text x="320.0" y="271.65" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">CustomersService</text>
<text x="320.0" y="315.15" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">SkillsResource</text>
<text x="320.0" y="358.65" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">(httpResource)</text>
<rect x="700" y="100" width="520" height="340" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="960.0" y="236.6" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">HttpClient</text>
<text x="960.0" y="293.4" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">provideHttpClient()</text>
<text x="960.0" y="334.0" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">provideHttpClientTesting()</text>
<rect x="1340" y="100" width="520" height="340" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
<text x="1600.0" y="230.79999999999998" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">HttpTesting</text>
<text x="1600.0" y="293.4" text-anchor="middle" font-family="Consolas, monospace" font-size="32" fill="#24292f">Controller</text>
<text x="1600.0" y="339.79999999999995" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">instead of a backend</text>
<line x1="584" y1="270" x2="692" y2="270" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<line x1="1224" y1="270" x2="1332" y2="270" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="60" y="560" width="560" height="220" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="340.0" y="650.8000000000001" text-anchor="middle" font-family="Consolas, monospace" font-size="32" fill="#24292f">expectOne(url)</text>
<text x="340.0" y="697.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">find the request</text>
<rect x="650" y="560" width="560" height="220" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="930.0" y="650.8000000000001" text-anchor="middle" font-family="Consolas, monospace" font-size="32" fill="#24292f">method, body</text>
<text x="930.0" y="697.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">assert what was sent</text>
<rect x="1240" y="560" width="560" height="220" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1520.0" y="650.8000000000001" text-anchor="middle" font-family="Consolas, monospace" font-size="32" fill="#24292f">flush(data)</text>
<text x="1520.0" y="697.2" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" fill="#57606a">deliver the response</text>
<line x1="1600" y1="444" x2="1600" y2="552" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="647.0" y="874" width="626.0" height="52" rx="26" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="909" text-anchor="middle" font-family="Consolas, monospace" font-size="32" fill="#24292f">afterEach: controller.verify()</text>
</svg>
