<text x="1480.0" y="745.3000000000001" text-anchor="middle" font-family="Consolas, monospace" font-size="28" fill="#24292f">selectedCustomer()</text>
<line x1="700" y1="284" x2="600" y2="552" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
