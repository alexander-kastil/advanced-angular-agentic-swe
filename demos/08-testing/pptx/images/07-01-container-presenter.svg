<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Integration-testing container and presenters</title>
<desc>The container passes customers down to the real table presenter; edit and delete outputs flow back up to the store spy.</desc>
