<rect x="160" y="560" width="760" height="240" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="540.0" y="665.8499999999999" text-anchor="middle" font-family="Consolas, monospace" font-size="38" font-weight="700" fill="#24292f">CustomersTable</text>
