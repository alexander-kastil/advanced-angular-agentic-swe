<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>An agent writes the spec</title>
<desc>You state the behaviour, the agent writes and runs the spec, you review it, and a mutation round proves it bites.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="40" y="100" width="420" height="420" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="250.0" y="274.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#24292f">1  You</text>
<text x="250.0" y="336.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">state the behaviour</text>
<text x="250.0" y="379.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">in sentences</text>
<line x1="464" y1="310" x2="516" y2="310" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="520" y="100" width="420" height="420" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="730.0" y="252.75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#24292f">2  Agent</text>
<text x="730.0" y="314.25" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">get_best_practices</text>
<text x="730.0" y="357.75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">writes the spec</text>
<text x="730.0" y="401.25" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">run_target</text>
<line x1="944" y1="310" x2="996" y2="310" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1000" y="100" width="420" height="420" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1210.0" y="274.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#24292f">3  You</text>
<text x="1210.0" y="336.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">review against</text>
<text x="1210.0" y="379.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">the checklist</text>
<line x1="1424" y1="310" x2="1476" y2="310" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1480" y="100" width="420" height="420" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
<text x="1690.0" y="274.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#24292f">4  Mutants</text>
<text x="1690.0" y="336.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">8 copies, one</text>
<text x="1690.0" y="379.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">rule broken each</text>
<rect x="1000" y="640" width="860" height="110" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1430.0" y="698.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">'&gt; 5' to '&gt;= 5': killed</text>
<rect x="1000" y="770" width="860" height="110" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1430.0" y="828.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">'&gt;= 100' to '&gt; 100': killed</text>
<path d="M 1690 524 L 1690 600 L 1430 600 L 1430 632" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="40" y="640" width="860" height="240" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
<text x="470.0" y="723.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">surviving mutant</text>
<text x="470.0" y="783.4000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">= a hole in the suite,</text>
<text x="470.0" y="826.9000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">named and located</text>
</svg>
