<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Async tests in a zoneless app</title>
<desc>Four tools replace fakeAsync: whenStable with PendingTasks, TestBed.tick, narrow fake timers and getLastFixture.</desc>
<defs><marker id="a-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<rect x="60" y="60" width="880" height="280" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="500.0" y="163.7" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">fixture.whenStable()</text>
<text x="500.0" y="223.39999999999998" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">waits for work wrapped in</text>
<text x="500.0" y="266.9" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">PendingTasks.run()</text>
<rect x="980" y="60" width="880" height="280" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1420.0" y="163.7" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">TestBed.tick()</text>
<text x="1420.0" y="223.39999999999998" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">flushes effects and rendering</text>
<text x="1420.0" y="266.9" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">replaces flushEffects()</text>
<rect x="60" y="380" width="880" height="280" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
<text x="500.0" y="483.70000000000005" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">vi.useFakeTimers()</text>
<text x="500.0" y="543.4000000000001" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">toFake: ['setInterval']</text>
<text x="500.0" y="586.9000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">fake only your timer</text>
<rect x="980" y="380" width="880" height="280" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1420.0" y="483.70000000000005" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">TestBed.getLastFixture()</text>
<text x="1420.0" y="543.4000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">reaches a fixture</text>
<text x="1420.0" y="586.9000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">a helper created</text>
<rect x="60" y="720" width="740" height="90" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="430.0" y="768.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">fakeAsync + tick()</text>
<rect x="1060" y="720" width="800" height="90" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1460.0" y="768.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">fake timers + TestBed.tick()</text>
<line x1="804" y1="765" x2="1052" y2="765" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="60" y="830" width="740" height="90" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="430.0" y="878.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">flush()</text>
<rect x="1060" y="830" width="800" height="90" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1460.0" y="878.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">await fixture.whenStable()</text>
<line x1="804" y1="875" x2="1052" y2="875" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="60" y="940" width="740" height="90" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="430.0" y="988.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">(done) =&gt; ...</text>
<rect x="1060" y="940" width="800" height="90" rx="16" fill="#e9f7ef" stroke="#2f8f57" stroke-width="3"/>
<text x="1460.0" y="988.75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">async () =&gt; { await ... }</text>
<line x1="804" y1="985" x2="1052" y2="985" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
</svg>
