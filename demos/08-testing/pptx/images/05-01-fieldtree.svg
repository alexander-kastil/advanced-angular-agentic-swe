<text x="1600.0" y="813.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">valid: action</text>
<text x="1600.0" y="873.4000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">server error lands</text>
<text x="1600.0" y="916.9000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">on the email field</text>
