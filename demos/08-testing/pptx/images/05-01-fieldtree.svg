<text x="960.0" y="249.4" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">signupForm</text>
<text x="960.0" y="316.7" text-anchor="middle" font-family="Consolas, monospace" font-size="34" fill="#24292f">email</text>
<text x="960.0" y="366.0" text-anchor="middle" font-family="Consolas, monospace" font-size="34" fill="#24292f">password</text>
<text x="960.0" y="415.3" text-anchor="middle" font-family="Consolas, monospace" font-size="34" fill="#24292f">confirm</text>
<text x="960.0" y="464.6" text-anchor="middle" font-family="Consolas, monospace" font-size="34" fill="#24292f">age</text>
<line x1="584" y1="180" x2="692" y2="180" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="1340" y="60" width="520" height="260" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
<text x="1600.0" y="172.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">email().errors()</text>
<text x="1600.0" y="215.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">'Enter a valid email'</text>
<rect x="1340" y="360" width="520" height="260" rx="16" fill="#fdecec" stroke="#c24141" stroke-width="3"/>
<text x="1600.0" y="472.0" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#24292f">confirm().errors()</text>
<text x="1600.0" y="515.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">'Passwords do not match'</text>
<line x1="1224" y1="190" x2="1332" y2="190" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<line x1="1224" y1="490" x2="1332" y2="490" stroke="#57606a" stroke-width="4" marker-end="url(#a-g)"/>
<rect x="60" y="720" width="520" height="260" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="320.0" y="814.5" text-anchor="middle" font-family="Consolas, monospace" font-size="40" font-weight="700" fill="#24292f">submit()</text>
<text x="320.0" y="876.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">resolves a boolean,</text>
<text x="320.0" y="919.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">marks the tree touched</text>
<rect x="700" y="720" width="520" height="260" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
<text x="960.0" y="813.7" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f">invalid</text>
<text x="960.0" y="873.4000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">onInvalid runs</text>
<text x="960.0" y="916.9000000000001" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a">action does not</text>
