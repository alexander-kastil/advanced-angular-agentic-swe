<div class="card">
  <div class="card-header">
    <h2 class="card-title">Personlist</h2>
  </div>
  <div class="card-content">
    <table class="data-table">
      <colgroup>
        <col style="width: 60%" />
        <col style="width: 15%" />
        <col style="width: 15%" />
        <col style="width: 10%" />
      </colgroup>
      <thead>
        <tr>
          <th class="align-left">Name</th>
          <th class="align-left">Gender</th>
          <th class="align-left">Age</th>
          <th><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody>
        @for (p of persons(); track p.id) {
          <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.gender }}</td>
            <td>{{ p.age }}</td>
            <td class="align-right">
              <button
                type="button"
                class="btn btn-outline"
                [attr.aria-label]="'Select ' + p.name"
                (click)="selectPerson(p)"
              >
                Select
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
