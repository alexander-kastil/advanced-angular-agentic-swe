<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Form submission flow</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="60" y="70" width="660" height="150" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="390" y="138" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">&lt;form [formRoot]&gt;</text>
<text x="390" y="185" text-anchor="middle" font-size="26" fill="#57606a">native submit event</text>
<polyline points="390,224 390,271" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="60" y="275" width="660" height="150" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="390" y="343" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">submit()</text>
<text x="390" y="390" text-anchor="middle" font-size="26" fill="#57606a">one call, options from form()</text>
<polyline points="390,429 390,476" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="60" y="480" width="660" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="390" y="548" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">mark every field touched</text>
<text x="390" y="595" text-anchor="middle" font-size="26" fill="#57606a">errors become visible</text>
<polyline points="390,634 390,681" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="60" y="685" width="660" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="390" y="753" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">wait for pending validators</text>
<text x="390" y="800" text-anchor="middle" font-size="26" fill="#57606a">per ignoreValidators</text>
<rect x="860" y="685" width="300" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="1010" y="772" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">valid?</text>
<polyline points="724,760 856,760" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<polyline points="1010,681 1010,554" fill="none" stroke="#2f8f57" stroke-width="4" marker-end="url(#g)"/>
<text x="1030" y="630" text-anchor="start" font-size="26" fill="#2f8f57">valid</text>
<rect x="860" y="390" width="600" height="160" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1160" y="460" text-anchor="middle" font-size="34" font-weight="700" font-family="Consolas, monospace" fill="#24292f">action(field)</text>
<text x="1160" y="510" text-anchor="middle" font-size="26" fill="#57606a">async, runs only when valid</text>
<polyline points="1160,386 1160,254" fill="none" stroke="#2f8f57" stroke-width="4" marker-end="url(#g)"/>
<rect x="860" y="70" width="600" height="180" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
<text x="1160" y="145" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">returns null</text>
<text x="1160" y="195" text-anchor="middle" font-size="28" fill="#57606a">submission succeeds</text>
<polyline points="1464,470 1516,470" fill="none" stroke="#c24141" stroke-width="4" marker-end="url(#r)"/>
<rect x="1520" y="330" width="360" height="280" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
<text x="1700" y="400" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">returns errors</text>
<text x="1700" y="460" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">kind, message,</text>
<text x="1700" y="500" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">fieldTree:</text>
<text x="1700" y="540" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">field.email</text>
<text x="1700" y="585" text-anchor="middle" font-size="24" fill="#57606a">lands on that field</text>
<polyline points="1164,760 1256,760" fill="none" stroke="#e0a534" stroke-width="4" marker-end="url(#o)"/>
<text x="1210" y="740" text-anchor="middle" font-size="24" fill="#b07d12">invalid</text>
<rect x="1260" y="685" width="400" height="150" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text x="1460" y="772" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">onInvalid()</text>
<rect x="860" y="900" width="1020" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="1370" y="975" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">ignoreValidators: 'pending' | 'none' | 'all'</text>
</g>
</svg>
