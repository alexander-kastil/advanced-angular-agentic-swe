<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Reviewing AI-written form tests</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="60" y="140" width="460" height="200" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="290" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">agent writes</text>
<text x="290" y="275" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">the spec</text>
<polyline points="524,240 636,240" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="640" y="50" width="1220" height="400" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1250" y="115" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">review checklist</text>
<text x="700" y="180" text-anchor="start" font-size="28" fill="#24292f">1. a failing case for every validator</text>
<text x="700" y="236" text-anchor="start" font-size="28" fill="#24292f">2. both sides of each boundary: 0 and 1, 99 and 100</text>
<text x="700" y="292" text-anchor="start" font-size="28" fill="#24292f">3. assert field state and error kind, not text</text>
<text x="700" y="348" text-anchor="start" font-size="28" fill="#24292f">4. cross-field rules in both directions</text>
<text x="700" y="404" text-anchor="start" font-size="28" fill="#24292f">5. no rule the schema does not state</text>
<polyline points="1520,454 1520,536" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="1180" y="540" width="680" height="180" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text x="1520" y="610" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">apply the mutation</text>
<text x="1520" y="665" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">min(quantity, 1) -&gt; min(quantity, 0)</text>
<polyline points="1176,630 1064,630" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="640" y="540" width="420" height="180" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="850" y="640" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">run the spec</text>
<polyline points="780,724 480,816" fill="none" stroke="#2f8f57" stroke-width="4" marker-end="url(#g)"/>
<polyline points="920,724 1220,816" fill="none" stroke="#c24141" stroke-width="4" marker-end="url(#r)"/>
<rect x="60" y="820" width="820" height="180" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
<text x="470" y="895" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">a test turns red</text>
<text x="470" y="945" text-anchor="middle" font-size="28" fill="#57606a">the spec really tests the rule</text>
<rect x="1040" y="820" width="820" height="180" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
<text x="1450" y="895" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">everything stays green</text>
<text x="1450" y="945" text-anchor="middle" font-size="26" fill="#57606a">the spec misses it: back to the checklist</text>
</g>
</svg>
