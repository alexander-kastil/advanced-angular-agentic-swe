<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Conditional field state</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="40" y="390" width="340" height="180" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="210" y="470" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">subscribe</text>
<text x="210" y="520" text-anchor="middle" font-size="26" fill="#57606a">checkbox</text>
<rect x="520" y="120" width="560" height="200" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
<text x="800" y="210" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">hidden(s.email)</text>
<text x="800" y="265" text-anchor="middle" font-size="26" fill="#57606a">until subscribed</text>
<rect x="520" y="420" width="560" height="200" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="800" y="510" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">disabled(s.promoCode)</text>
<text x="800" y="565" text-anchor="middle" font-size="26" fill="#57606a">until subscribed</text>
<rect x="520" y="720" width="560" height="200" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="800" y="810" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">readonly(s.username)</text>
<text x="800" y="865" text-anchor="middle" font-size="26" fill="#57606a">always</text>
<polyline points="384,440 450,440 450,220 516,220" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<polyline points="384,480 516,480" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<text x="1520" y="90" text-anchor="middle" font-size="26" fill="#57606a">cascading row inside applyEach(s.skills)</text>
<rect x="1180" y="120" width="680" height="180" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1520" y="200" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">techType</text>
<text x="1520" y="250" text-anchor="middle" font-size="26" fill="#57606a">pick a category</text>
<polyline points="1520,304 1520,386" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="1180" y="390" width="680" height="260" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1520" y="465" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">techValues</text>
<text x="1520" y="525" text-anchor="middle" font-size="26" fill="#57606a">disabled until techType is set</text>
<text x="1520" y="575" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">required(..., { when })</text>
<polyline points="1520,654 1520,736" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="1180" y="740" width="680" height="200" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text x="1520" y="820" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">category changes</text>
<text x="1520" y="875" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">techValues().value.set('')</text>
</g>
</svg>
