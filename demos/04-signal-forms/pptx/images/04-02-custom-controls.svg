<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Custom controls</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a534"/></marker></defs>
<rect width="1920" height="1080" fill="#ffffff"/>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="40" y="80" width="520" height="600" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="300" y="160" text-anchor="middle" font-size="36" font-weight="700" font-family="Consolas, monospace" fill="#24292f">[formField]</text>
<text x="300" y="215" text-anchor="middle" font-size="26" fill="#57606a">the FormField directive</text>
<text x="300" y="300" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">errors</text>
<text x="300" y="370" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">disabled</text>
<text x="300" y="440" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">readonly</text>
<text x="300" y="510" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">hidden</text>
<text x="300" y="580" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">invalid, pending, touched</text>
<rect x="900" y="80" width="980" height="600" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1390" y="160" text-anchor="middle" font-size="36" font-weight="700" font-family="Consolas, monospace" fill="#24292f">RatingInputComponent</text>
<text x="1390" y="220" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">implements FormValueControl&lt;number&gt;</text>
<rect x="960" y="280" width="860" height="100" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1390" y="343" text-anchor="middle" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">value = model.required&lt;number&gt;()</text>
<text x="1390" y="450" text-anchor="middle" font-size="26" fill="#57606a">the only required member</text>
<rect x="960" y="520" width="860" height="100" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1390" y="583" text-anchor="middle" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">touch = output&lt;void&gt;()</text>
<polyline points="564,330 896,330" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<polyline points="896,360 564,360" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<text x="730" y="310" text-anchor="middle" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">value</text>
<polyline points="564,450 896,450" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<text x="730" y="430" text-anchor="middle" font-size="28" fill="#57606a">inputs</text>
<polyline points="896,570 564,570" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<text x="730" y="550" text-anchor="middle" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">touch</text>
<text x="730" y="620" text-anchor="middle" font-size="24" font-family="Consolas, monospace" fill="#57606a">markAsTouched()</text>
<text x="960" y="750" text-anchor="middle" font-size="28" fill="#57606a">transformedValue(): raw text to a typed model value</text>
<rect x="40" y="800" width="420" height="160" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="250" y="870" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">raw '12,50'</text>
<text x="250" y="915" text-anchor="middle" font-size="24" fill="#57606a">what the user typed</text>
<polyline points="464,880 556,880" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#a)"/>
<rect x="560" y="800" width="300" height="160" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text x="710" y="893" text-anchor="middle" font-size="32" font-weight="700" font-family="Consolas, monospace" fill="#24292f">parse</text>
<polyline points="864,860 996,860" fill="none" stroke="#2f8f57" stroke-width="4" marker-end="url(#g)"/>
<rect x="1000" y="790" width="380" height="110" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
<text x="1190" y="857" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">model: 12.5</text>
<polyline points="864,920 930,920 930,1000 1660,1000 1660,954" fill="none" stroke="#c24141" stroke-width="4" marker-end="url(#r)"/>
<rect x="1440" y="800" width="440" height="150" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
<text x="1660" y="860" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">parse error</text>
<text x="1660" y="905" text-anchor="middle" font-size="26" font-family="Consolas, monospace" fill="#24292f">{ kind: 'money' }</text>
</g>
</svg>
