<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>From laptop to a hardened box</title>
  <desc>Claude Code with the deploy agent and manifest reaches an Ubuntu box over SSH; layers of hardening, Docker and a Caddy edge; Lighthouse CI loop through the edge.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="60" y="260" width="460" height="520" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="290" y="469" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">laptop</text>
  <text x="290" y="512" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">Claude Code</text>
  <text x="290" y="553" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">ssh-deploy-agent</text>
  <text x="290" y="593" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">deploy-manifest.json</text>
  <line x1="520" y1="520" x2="640" y2="520" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <text x="580" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">SSH :2222</text>
  <rect x="650" y="120" width="700" height="840" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="1000" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f">Ubuntu box</text>
  <rect x="690" y="720" width="620" height="200" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="808" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">deploy user, key-only SSH</text>
  <text x="1000" y="849" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#24292f">ufw 22 / 80 / 443, unattended upgrades</text>
  <rect x="690" y="490" width="620" height="190" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1000" y="594" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#24292f">Docker Engine + Compose</text>
  <rect x="690" y="220" width="620" height="230" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1000" y="324" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#24292f">Caddy edge :80 :443</text>
  <text x="1000" y="365" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">reverse_proxy app:8080</text>
  <line x1="1350" y1="335" x2="1470" y2="335" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="1480" y="230" width="380" height="210" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1670" y="321" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f">browser and</text>
  <text x="1670" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f">Lighthouse CI</text>
  <path d="M1670,440 L1670,620 L1356,620" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#a-grey)"/>
  <text x="1670" y="680" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">fix, redeploy, compare</text>
</svg>
