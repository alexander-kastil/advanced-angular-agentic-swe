<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>One public edge, DNS before ACME</title>
  <desc>Caddy publishes 80 and 443, the app only exposes 8080; preconditions before the first certificate request.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="80" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f">before the first certificate request</text>
  <rect x="80" y="120" width="700" height="120" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="106" y="188" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#24292f">1  hostname resolves to this box</text>
  <rect x="80" y="270" width="700" height="120" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="106" y="338" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#24292f">2  port 80 reachable from outside</text>
  <rect x="80" y="420" width="700" height="120" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="106" y="488" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#24292f">3  edge listening on 80 and 443</text>
  <rect x="80" y="590" width="700" height="170" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="430" y="643" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#24292f">Let's Encrypt: 5 failed</text>
  <text x="430" y="684" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#24292f">validations per hostname per hour</text>
  <text x="430" y="724" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">then Caddy backs off</text>
  <rect x="900" y="90" width="940" height="870" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="1370" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="400" fill="#57606a">network box-net</text>
  <rect x="960" y="190" width="820" height="230" rx="18" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1370" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">caddy</text>
  <text x="1370" y="319" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="600" fill="#24292f">ports: 80, 443</text>
  <text x="1370" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#57606a">the only published ports</text>
  <line x1="1370" y1="420" x2="1370" y2="520" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <text x="1490" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#57606a">reverse_proxy</text>
  <rect x="960" y="530" width="820" height="200" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1370" y="619" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#24292f">app</text>
  <text x="1370" y="664" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="600" fill="#24292f">expose: 8080 only</text>
  <rect x="960" y="780" width="820" height="140" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1370" y="858" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="600" fill="#24292f">tls internal: local CA on the laptop box</text>
  <rect x="80" y="820" width="700" height="140" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="430" y="898" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#24292f">delete tls internal for a real domain</text>
</svg>
