<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Bootstrap order</title>
  <desc>Seven bootstrap steps, each with a proof from the host; step 6 is the lockout step.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="60" y="40" width="1800" height="125" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="62" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="114" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">1</text>
  <text x="210" y="116" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">throwaway target up</text>
  <rect x="1420" y="66" width="410" height="72" rx="36" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1625" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">box answers on 2222</text>
  <rect x="60" y="185" width="1800" height="125" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="207" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="259" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">2</text>
  <text x="210" y="261" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">prove SSH access</text>
  <rect x="1420" y="211" width="410" height="72" rx="36" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1625" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">whoami from the host</text>
  <rect x="60" y="330" width="1800" height="125" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="352" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="404" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">3</text>
  <text x="210" y="406" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">non-root deploy user</text>
  <rect x="1420" y="356" width="410" height="72" rx="36" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1625" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">key login works</text>
  <rect x="60" y="475" width="1800" height="125" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="497" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="549" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">4</text>
  <text x="210" y="551" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">patches, unattended upgrades, fail2ban</text>
  <rect x="1420" y="501" width="410" height="72" rx="36" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1625" y="545" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">services enabled</text>
  <rect x="60" y="620" width="1800" height="125" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="642" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="694" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">5</text>
  <text x="210" y="696" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">Docker Engine + Compose plugin</text>
  <rect x="1420" y="646" width="410" height="72" rx="36" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1625" y="690" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">docker compose version</text>
  <rect x="60" y="765" width="1800" height="125" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <rect x="90" y="787" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="839" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">6</text>
  <text x="210" y="841" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">prove key in a 2nd session, then close root and passwords</text>
  <rect x="1420" y="791" width="410" height="72" rx="36" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="1625" y="835" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">lockout step</text>
  <rect x="60" y="910" width="1800" height="125" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="932" width="80" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="130" y="984" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">7</text>
  <text x="210" y="986" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#24292f">ufw: deny in, allow 22 / 80 / 443</text>
  <rect x="1420" y="936" width="410" height="72" rx="36" fill="#e9f7ef" stroke="#2f8f57" stroke-width="2"/>
  <text x="1625" y="980" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#24292f">out of band</text>
</svg>
