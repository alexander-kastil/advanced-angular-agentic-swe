<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Deployment agent gates and contract</title>
  <desc>Agent frontmatter tools, settings.json allow and deny, and the manifest feed a JSON response whose empty evidence arrays mean reject.</desc>
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f57"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker></defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="60" y="70" width="560" height="420" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="340" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f">agent frontmatter</text>
  <text x="340" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="400" fill="#24292f">tools:</text>
  <text x="340" y="311" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">Read Write Edit</text>
  <text x="340" y="351" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">Bash Glob Grep</text>
  <rect x="680" y="70" width="560" height="420" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#24292f">.claude/settings.json</text>
  <text x="960" y="267" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="400" fill="#2f8f57">allow: ssh git ls</text>
  <text x="960" y="309" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="400" fill="#c24141">deny: rm npm</text>
  <text x="960" y="351" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="400" fill="#c24141">node dotnet</text>
  <rect x="1300" y="70" width="560" height="420" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1580" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#24292f">deploy-manifest.json</text>
  <text x="1580" y="269" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#24292f">host, sshPort, user</text>
  <text x="1580" y="309" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#24292f">keyFile, image tag</text>
  <text x="1580" y="349" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#24292f">verifyUrls</text>
  <line x1="340" y1="490" x2="340" y2="560" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <line x1="960" y1="490" x2="960" y2="560" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <line x1="1580" y1="490" x2="1580" y2="560" stroke="#57606a" stroke-width="3" marker-end="url(#a-grey)"/>
  <rect x="60" y="570" width="1800" height="440" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="650" text-anchor="start" font-family="Consolas, monospace" font-size="32" font-weight="400" fill="#24292f">"status": "partial"</text>
  <text x="120" y="722" text-anchor="start" font-family="Consolas, monospace" font-size="32" font-weight="400" fill="#24292f">"imageTags": ["nginx:1.27-alpine"]</text>
  <text x="120" y="794" text-anchor="start" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#c24141">"verifiedUrls": []</text>
  <text x="120" y="866" text-anchor="start" font-family="Consolas, monospace" font-size="32" font-weight="700" fill="#c24141">"containerState": []</text>
  <text x="120" y="938" text-anchor="start" font-family="Consolas, monospace" font-size="32" font-weight="400" fill="#24292f">"errors": ["docker: command not found"]</text>
  <rect x="1260" y="640" width="540" height="300" rx="18" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
  <text x="1530" y="756" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f">empty evidence</text>
  <text x="1530" y="801" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f">= the caller</text>
  <text x="1530" y="845" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f">rejects it</text>
</svg>
